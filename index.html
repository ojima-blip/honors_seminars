<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>マクロ経済学 演習｜ERE対策</title>
<style>
:root{
  --ink:#16263c;
  --ink-soft:#5d6b7d;
  --paper:#e9edf2;
  --surface:#ffffff;
  --line:#d3dbe4;
  --indigo:#274d8c;
  --indigo-soft:#e7eef9;
  --correct:#1d6f52;
  --correct-soft:#e3efe9;
  --wrong:#a4383a;
  --wrong-soft:#f7e9e9;
  --gen:#8d6414;
  --gen-soft:#f6efe1;
  --mincho:"Hiragino Mincho ProN","Yu Mincho","YuMincho","MS PMincho",serif;
  --gothic:"Hiragino Kaku Gothic ProN","Yu Gothic","YuGothic","Noto Sans JP","Meiryo",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--gothic);
  font-size:16px;
  line-height:1.75;
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:660px;margin:0 auto;padding:0 16px 64px}

/* header */
.bar{
  position:sticky;top:0;z-index:10;
  background:rgba(233,237,242,.94);
  backdrop-filter:saturate(1.4) blur(6px);
  border-bottom:1px solid var(--line);
}
.bar-in{max-width:660px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;min-height:48px}
.bar h2{font-family:var(--mincho);font-size:16px;font-weight:600;margin:0;letter-spacing:.04em}
.back{
  appearance:none;border:1px solid var(--line);background:var(--surface);
  color:var(--ink);font-family:inherit;font-size:13px;
  padding:5px 11px;border-radius:5px;cursor:pointer;flex:none;
}
.back:hover{border-color:var(--indigo);color:var(--indigo)}
.spacer{flex:1}
.timer{font-variant-numeric:tabular-nums;font-size:15px;color:var(--ink-soft)}
.timer.low{color:var(--wrong);font-weight:700}

/* hero */
.hero{padding:34px 0 22px}
.hero h1{
  font-family:var(--mincho);font-weight:600;
  font-size:30px;line-height:1.35;margin:0 0 10px;letter-spacing:.03em;
}
.hero p{margin:0;color:var(--ink-soft);font-size:14.5px;max-width:44em}

/* tag cards */
.tags{display:flex;flex-direction:column;gap:12px;margin:22px 0 0}
.tag{
  background:var(--surface);border:1px solid var(--line);border-radius:10px;
  padding:16px 16px 14px;text-align:left;width:100%;
  font-family:inherit;color:inherit;cursor:pointer;display:block;
}
.tag:hover{border-color:var(--indigo)}
.tag:disabled{cursor:default;opacity:.55}
.tag:disabled:hover{border-color:var(--line)}
.tag-head{display:flex;align-items:baseline;gap:10px}
.tag-name{font-family:var(--mincho);font-size:18px;font-weight:600;letter-spacing:.03em}
.tag-count{font-size:12.5px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.tag-topics{font-size:13px;color:var(--ink-soft);margin:4px 0 12px;line-height:1.6}
.meter{height:5px;background:var(--paper);border-radius:3px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--indigo);width:0}
.tag-stat{font-size:12.5px;color:var(--ink-soft);margin-top:6px;font-variant-numeric:tabular-nums}

/* section heading */
.sec{font-family:var(--mincho);font-size:14px;letter-spacing:.08em;color:var(--ink-soft);margin:34px 0 12px;font-weight:600}

/* buttons */
.row{display:flex;flex-direction:column;gap:10px}
.btn{
  appearance:none;font-family:inherit;font-size:15px;cursor:pointer;
  background:var(--surface);border:1px solid var(--line);color:var(--ink);
  padding:13px 16px;border-radius:8px;text-align:left;line-height:1.5;
}
.btn:hover{border-color:var(--indigo)}
.btn b{font-weight:600;display:block}
.btn span{font-size:12.5px;color:var(--ink-soft)}
.btn:disabled{opacity:.45;cursor:default}
.btn:disabled:hover{border-color:var(--line)}
.btn.primary{background:var(--indigo);border-color:var(--indigo);color:#fff;text-align:center;font-weight:600}
.btn.primary:hover{background:#1e3d72}
.btn.primary span{color:#c9d8f0}

/* question */
.qmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:22px 0 10px}
.chip{font-size:11.5px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink-soft)}
.chip.gen{background:var(--gen-soft);border-color:#e4d6b6;color:var(--gen)}
.chip.no{font-variant-numeric:tabular-nums;background:var(--indigo-soft);border-color:#cddcf3;color:var(--indigo)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px 18px}
.stem{font-size:16.5px;line-height:1.85;margin:0 0 4px}
.stem .give{display:block;margin-top:10px;padding-left:14px;border-left:2px solid var(--indigo-soft);font-variant-numeric:tabular-nums}
.choices{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.ch{
  display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;
  font-family:inherit;font-size:15.5px;line-height:1.7;color:inherit;
  background:var(--surface);border:1px solid var(--line);border-radius:7px;
  padding:11px 13px;cursor:pointer;
}
.ch:hover{border-color:var(--indigo);background:var(--indigo-soft)}
.ch .n{
  flex:none;width:23px;height:23px;border-radius:4px;border:1px solid var(--line);
  display:grid;place-items:center;font-size:13px;font-variant-numeric:tabular-nums;
  color:var(--ink-soft);margin-top:2px;
}
.ch .t{flex:1;font-variant-numeric:tabular-nums}
.ch[disabled]{cursor:default}
.ch[disabled]:hover{border-color:var(--line);background:var(--surface)}
.ch.picked{border-color:var(--indigo);background:var(--indigo-soft)}
.ch.ok{border-color:var(--correct);background:var(--correct-soft)}
.ch.ok .n{border-color:var(--correct);background:var(--correct);color:#fff}
.ch.ng{border-color:var(--wrong);background:var(--wrong-soft)}
.ch.ng .n{border-color:var(--wrong);background:var(--wrong);color:#fff}
.ch .note{display:block;font-size:13px;color:var(--ink-soft);margin-top:5px;line-height:1.65}

.verdict{font-family:var(--mincho);font-size:17px;font-weight:600;margin:18px 0 6px;letter-spacing:.04em}
.verdict.ok{color:var(--correct)}
.verdict.ng{color:var(--wrong)}
.explain{font-size:14.5px;line-height:1.85;color:var(--ink);margin:0;font-variant-numeric:tabular-nums}
.explain .f{display:block;margin:8px 0;padding:9px 12px;background:var(--paper);border-radius:6px;font-size:14px}
.after{margin-top:20px}

/* result */
.score{font-family:var(--mincho);font-size:44px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.score small{font-size:18px;color:var(--ink-soft);font-weight:400}
.bars{margin:20px 0 0;display:flex;flex-direction:column;gap:14px}
.bar-row .lab{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:5px}
.bar-row .lab span:last-child{color:var(--ink-soft);font-variant-numeric:tabular-nums}
.track{height:8px;background:var(--paper);border-radius:4px;overflow:hidden}
.track i{display:block;height:100%;background:var(--indigo)}
textarea{
  width:100%;min-height:150px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:12.5px;line-height:1.7;padding:12px;border:1px solid var(--line);
  border-radius:8px;background:var(--surface);color:var(--ink);resize:vertical;
}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:24px 18px;text-align:center;color:var(--ink-soft);font-size:14.5px}

/* formula sheet */
.fs h3{font-family:var(--mincho);font-size:17px;font-weight:600;margin:26px 0 8px;letter-spacing:.03em}
.fs dl{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 16px}
.fs dt{font-size:13.5px;color:var(--ink-soft);margin-top:12px}
.fs dd{margin:2px 0 12px;font-size:15.5px;font-variant-numeric:tabular-nums}
.fs dd em{font-style:normal;font-size:13px;color:var(--ink-soft);display:block;margin-top:2px}

.gtab{margin:12px 0 2px;overflow-x:auto}
.gtab table{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
.gtab th,.gtab td{border:1px solid var(--line);padding:6px 8px;text-align:right;line-height:1.5}
.gtab th{background:var(--paper);font-weight:600;text-align:center;color:var(--ink-soft)}
.gtab tr>th:first-child{text-align:left;white-space:nowrap}
.gamerow{display:flex;flex-direction:column;gap:10px}
.game{
  display:flex;align-items:center;gap:13px;text-decoration:none;color:inherit;
  background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;
}
.game:hover{border-color:var(--indigo)}
.game .ico{flex:none;font-size:22px;line-height:1}
.game b{display:block;font-weight:600;font-size:15px}
.game span{font-size:12.5px;color:var(--ink-soft);line-height:1.6}
.field{display:block}
.field span{display:block;font-size:13px;color:var(--ink-soft);margin-bottom:6px}
.field input{
  width:100%;font-family:inherit;font-size:16px;padding:10px 12px;
  border:1px solid var(--line);border-radius:7px;background:var(--paper);color:var(--ink);
  font-variant-numeric:tabular-nums;
}
.field input:focus{background:var(--surface);border-color:var(--indigo);outline:none}
.hist{margin-top:12px;border-top:1px solid var(--line)}
.hist-row{display:flex;justify-content:space-between;font-size:13.5px;padding:7px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.hist-row span:last-child{color:var(--ink-soft)}
.hint{font-size:13px;color:var(--ink-soft);margin:14px 0 0}
.foot{margin-top:40px;padding-top:16px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink-soft)}
:focus-visible{outline:2px solid var(--indigo);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:400px){
  .hero h1{font-size:25px}
  .wrap{padding:0 13px 56px}
  .card{padding:16px 14px}
}
</style>
</head>
<body>

<div class="bar"><div class="bar-in">
  <button class="back" id="back" hidden>もどる</button>
  <h2 id="barTitle">マクロ経済学 演習</h2>
  <span class="spacer"></span>
  <span class="timer" id="timer" hidden></span>
</div></div>

<div class="wrap" id="app"></div>

<script src="questions.js"></script>
<script>
"use strict";

/* 問題バンクとユーティリティは questions.js に分離しました */
/* ============================================================
   3. 状態
   ============================================================ */
const state = {
  view:"home",
  sid:"",                 // 学籍番号（任意・端末内にのみ保存）
  progress:{},            // tagId -> {seen, correct}
  lecProgress:{},         // lecId -> {seen, correct}
  wrong:[],               // 復習用スナップショット
  log:[],                 // 模試の履歴（直近10件）
  storage:"unknown",      // "ok" | "off"
  levelTag:null,          // 難易度選択画面で表示中のタグ
  drill:null, exam:null
};
TAGS.forEach(t => state.progress[t.id] = {seen:0, correct:0});
LECTURES.forEach(l => state.lecProgress[l.id] = {seen:0, correct:0});

/* ---- 端末内への保存（localStorage）----
   ブラウザの設定やプライベートモードでは使えないことがあるため、
   失敗しても教材そのものは動き続けるようにしてある。           */
const STORE_KEY = "ere-macro-drill-v1";
function save(){
  try{
    localStorage.setItem(STORE_KEY, JSON.stringify({
      v:1, sid:state.sid, progress:state.progress, lecProgress:state.lecProgress,
      wrong:state.wrong, log:state.log, at:Date.now()
    }));
    state.storage = "ok";
    return true;
  }catch(err){ state.storage = "off"; return false; }
}
function load(){
  let raw = null;
  try{ raw = localStorage.getItem(STORE_KEY); state.storage = "ok"; }
  catch(err){ state.storage = "off"; return; }
  if(!raw) return;
  try{
    const d = JSON.parse(raw);
    if(!d || d.v !== 1) return;
    state.sid = typeof d.sid === "string" ? d.sid : "";
    TAGS.forEach(t => {
      const p = d.progress && d.progress[t.id];
      if(p && typeof p.seen === "number" && typeof p.correct === "number")
        state.progress[t.id] = {seen:p.seen, correct:p.correct};
    });
    LECTURES.forEach(l => {
      const q = d.lecProgress && d.lecProgress[l.id];
      if(q && typeof q.seen === "number" && typeof q.correct === "number")
        state.lecProgress[l.id] = {seen:q.seen, correct:q.correct};
    });
    if(Array.isArray(d.wrong)) state.wrong = d.wrong.filter(q => q && Array.isArray(q.choices));
    if(Array.isArray(d.log)) state.log = d.log.slice(0,10);
  }catch(err){ /* 壊れた保存データは無視して初期状態で続ける */ }
}
function clearSaved(){
  try{ localStorage.removeItem(STORE_KEY); }catch(err){}
  state.sid = ""; state.wrong = []; state.log = [];
  TAGS.forEach(t => state.progress[t.id] = {seen:0, correct:0});
  LECTURES.forEach(l => state.lecProgress[l.id] = {seen:0, correct:0});
}

/* materialize() は questions.js で定義しています */
const tagName = id => (TAGS.find(t=>t.id===id)||{name:id}).name;
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const nl = s => esc(s).replace(/\n/g,"<br>");

/* ============================================================
   4. 画面
   ============================================================ */
const app = document.getElementById("app");
const backBtn = document.getElementById("back");
const barTitle = document.getElementById("barTitle");
const timerEl = document.getElementById("timer");

backBtn.addEventListener("click", () => {
  if(state.exam && state.exam.running){
    if(!confirm("模試を中断してホームにもどります。解答は記録されません。")) return;
    stopTimer();
  }
  if(state.view === "drill"){ state.drill && state.drill.lec ? go("home") : go("level"); return; }
  go("home");
});

function go(view, payload){
  state.view = view;
  if(view === "home"){ stopTimer(); state.drill = null; state.exam = null; }
  if(view === "level" && state.drill) state.levelTag = state.drill.tag;
  render(payload);
  window.scrollTo({top:0, behavior:"instant"});
}

function render(payload){
  backBtn.hidden = (state.view === "home");
  timerEl.hidden = !(state.view === "exam" && state.exam && state.exam.running);
  const v = {home:viewHome, level:viewLevel, drill:viewDrill, exam:viewExam,
             examResult:viewExamResult, review:viewReview, sheet:viewSheet}[state.view];
  v(payload);
}

/* ---- ホーム ---- */
function viewHome(){
  barTitle.textContent = "マクロ経済学 演習";

  const lecCards = LECTURES.map(l => {
    const n = BANK.filter(q=>q.lec===l.id).length;
    const p = state.lecProgress[l.id];
    const rate = p.seen ? Math.round(p.correct/p.seen*100) : 0;
    const w = p.seen ? Math.max(4, rate) : 0;
    return `<button class="tag" data-lec="${l.id}">
      <span class="tag-head"><span class="tag-name">${esc(l.label)}　${esc(l.title)}</span><span class="tag-count">${n}問</span></span>
      <span class="tag-topics">${esc(l.sub)}</span>
      <span class="meter"><i style="width:${w}%"></i></span>
      <span class="tag-stat">${p.seen ? `${p.seen}問を解答／正答率 ${rate}％` : "まだ解答していません"}</span>
    </button>`;
  }).join("");

  const tagCards = TAGS.map(t => {
    const pool = BANK.filter(q=>q.tag===t.id);
    const cA = pool.filter(q=>q.level==="A").length;
    const cB = pool.filter(q=>q.level==="B").length;
    const cC = pool.filter(q=>q.level==="C").length;
    const n = `${pool.length}問（基礎${cA}・標準${cB}${cC?"・応用"+cC:""}）`;
    const p = state.progress[t.id];
    const rate = p.seen ? Math.round(p.correct/p.seen*100) : 0;
    const w = p.seen ? Math.max(4, rate) : 0;
    return `<button class="tag" data-tag="${t.id}">
      <span class="tag-head"><span class="tag-name">${esc(t.name)}</span><span class="tag-count">${n}</span></span>
      <span class="tag-topics">${esc(t.topics)}</span>
      <span class="meter"><i style="width:${w}%"></i></span>
      <span class="tag-stat">${p.seen ? `${p.seen}問を解答／正答率 ${rate}％` : "まだ解答していません"}</span>
    </button>`;
  }).join("");

  const coming = [
    {n:"消費と投資", s:""},
    {n:"貨幣と金融", s:""},
    {n:"AD-AS・物価と失業", s:""},
    {n:"国際マクロ", s:"国際収支、為替、開放経済の乗数、マンデル＝フレミング"},
    {n:"経済成長", s:""},
    {n:"景気循環と学説史", s:""}
  ].map(t=>`<button class="tag" disabled><span class="tag-head"><span class="tag-name">${esc(t.n)}</span><span class="tag-count">準備中</span></span>${t.s?`<span class="tag-topics" style="margin-bottom:0">${esc(t.s)}</span>`:``}</button>`).join("");

  const history = state.log.length ? `<div class="hist">${
    state.log.slice(0,5).map(r=>`<div class="hist-row"><span>${esc(r.date)}</span><span>${r.correct} / ${r.total}</span></div>`).join("")
  }</div>` : `<p class="hint" style="margin-top:10px">模試を受けると、結果がここに残ります。</p>`;

  app.innerHTML = `
    <div class="hero">
      <h1>マクロ経済学 演習</h1>
      <p>経済学検定（ERE）の四答択一形式にあわせた演習です。数値問題は解くたびに数字が変わるので、答えを覚えてしまうことなく何度でも練習できます。</p>
    </div>

    <div class="sec">講義回から</div>
    <div class="tags">${lecCards}</div>
    <p class="hint">その回の講義で扱った範囲だけを、10問まとめて復習します。授業直後の確認に使ってください。</p>

    <div class="sec">分野から</div>
    <div class="tags">${tagCards}</div>
    <p class="hint">回をまたいで、分野ごとに演習します。難易度を選ぶと、プールから最大10問がランダムに出題されます。</p>

    <div class="sec">力だめし</div>
    <div class="row">
      <button class="btn primary" id="goExam">模試を始める<span>全分野から20問・制限時間20分・応用問題は含みません</span></button>
      <button class="btn" id="goReview" ${state.wrong.length? "":"disabled"}><b>まちがえた問題を解き直す</b><span>${state.wrong.length ? state.wrong.length+"問たまっています" : "まちがえた問題がここに集まります"}</span></button>
      <button class="btn" id="goSheet"><b>公式シート</b><span>定義と公式のまとめ</span></button>
    </div>

    <div class="sec">気分転換</div>
    <div class="gamerow">
      <a class="game" href="shooting.html">
        <span class="ico">⚔️</span>
        <span><b>マクロ シューティング</b>
        <span>敵をたおして出たアイテムを取ると問題が出ます。正解でパワーアップ。出題範囲は選べます。</span></span>
      </a>
      <a class="game" href="typing.html">
        <span class="ico">⌨️</span>
        <span><b>タイピング だいぼうけん</b>
        <span>気分を変えたいときに。キーボードに慣れておくと、レポートも実験も速くなります。</span></span>
      </a>
    </div>

    <div class="sec">学習記録</div>
    <div class="card">
      <label class="field">
        <span>学籍番号（任意）</span>
        <input id="sid" type="text" inputmode="latin" autocomplete="off" maxlength="20"
               placeholder="例：2400000" value="${esc(state.sid)}">
      </label>
      <p class="hint" style="margin-top:10px">${
        state.storage === "off"
        ? "このブラウザでは保存が使えない設定になっています。進捗はページを閉じると消えるため、模試の結果はその都度コピーして控えてください。"
        : "進捗はこのブラウザの中にだけ保存されます。学籍番号は模試の結果に書き出すためのもので、どこかへ送信されることはありません。"
      }</p>
      ${history}
      <div class="row" style="margin-top:14px">
        <button class="btn" id="reset"><b>学習記録を消す</b><span>進捗・復習リスト・模試履歴をすべて初期化します</span></button>
      </div>
    </div>

    <div class="sec">今後追加する分野</div>
    <div class="tags">${coming}</div>

    <p class="foot">創価大学 マクロ経済学／ERE対策演習。問題は本教材のために作成したものです。</p>
  `;
  app.querySelectorAll("[data-lec]").forEach(b =>
    b.addEventListener("click", () => startLecture(b.dataset.lec)));
  app.querySelectorAll("[data-tag]").forEach(b =>
    b.addEventListener("click", () => { state.levelTag = b.dataset.tag; go("level"); }));
  document.getElementById("goExam").addEventListener("click", startExam);
  document.getElementById("goSheet").addEventListener("click", () => go("sheet"));
  const rv = document.getElementById("goReview");
  if(!rv.disabled) rv.addEventListener("click", startReview);

  const sid = document.getElementById("sid");
  sid.addEventListener("input", () => { state.sid = sid.value.trim(); });
  sid.addEventListener("change", save);
  sid.addEventListener("blur", save);

  document.getElementById("reset").addEventListener("click", () => {
    if(!confirm("学習記録をすべて消します。もとにもどせません。")) return;
    clearSaved();
    go("home");
  });
}

/* ---- 分野別演習 ---- */
const LEVELS = {
  A:{label:"基礎", desc:"定義と基本的な計算を確認します"},
  B:{label:"標準", desc:"ERE本試験に近い難易度です"},
  C:{label:"応用", desc:"産業連関表など、踏み込んだ計算問題です"}
};
const DRAW = 10;   // 1回の演習で出す問題数の上限

function viewLevel(){
  const tag = state.levelTag;
  barTitle.textContent = tagName(tag);
  const pool = BANK.filter(q=>q.tag===tag);
  const at = L => pool.filter(q=>q.level===L).length;
  const btn = L => at(L)
    ? `<button class="btn" data-lv="${L}"><b>${LEVELS[L].label}　${at(L)}問</b><span>${LEVELS[L].desc}${at(L)>DRAW?`／このうち${DRAW}問を出題`:""}</span></button>`
    : "";
  app.innerHTML = `
    <div class="hero"><h1>${esc(tagName(tag))}</h1>
    <p>難易度を選んでください。出題はプールからのランダム抽出なので、同じ難易度を選んでも毎回ちがう組合せになります。</p></div>
    <div class="row">
      ${btn("A")}${btn("B")}${btn("C")}
      <button class="btn primary" data-lv="ALL">難易度を問わず${DRAW}問</button>
    </div>`;
  app.querySelectorAll("[data-lv]").forEach(b =>
    b.addEventListener("click", () => startDrill(tag, b.dataset.lv)));
}

function startLecture(lecId){
  const pool = BANK.filter(q => q.lec === lecId);
  if(!pool.length) return;
  const qs = shuffle(pool);
  state.drill = {lec:lecId, tag:null, level:null, queue:qs, i:0,
                 cur:materialize(qs[0]), answered:false, source:"drill"};
  go("drill");
}

function startDrill(tag, level){
  const pool = BANK.filter(q => q.tag===tag && (level==="ALL" || q.level===level));
  if(!pool.length) return;
  const qs = shuffle(pool).slice(0, DRAW);
  state.drill = {lec:null, tag, level, queue:qs, i:0, cur:materialize(qs[0]), answered:false, source:"drill"};
  go("drill");
}
function startReview(){
  if(!state.wrong.length) return;
  state.drill = {tag:null, queue:null, i:0, list:state.wrong.slice(),
                 cur:state.wrong[0], answered:false, source:"review"};
  go("review");
}

const lecName = id => { const l = LECTURES.find(x=>x.id===id); return l ? l.label+"　"+l.title : id; };

function viewDrill(){
  const d = state.drill;
  barTitle.textContent = d.lec ? lecName(d.lec) : tagName(d.tag);
  app.innerHTML = questionHTML(d.cur, d.i+1, d.queue.length) + `<div class="after" id="after"></div>`;
  wireChoices(onDrillAnswer);
}
function viewReview(){
  const d = state.drill;
  barTitle.textContent = "まちがえた問題";
  app.innerHTML = questionHTML(d.cur, d.i+1, d.list.length) + `<div class="after" id="after"></div>`;
  wireChoices(onReviewAnswer);
}

function questionHTML(q, idx, total){
  return `
  <div class="qmeta">
    <span class="chip no">${idx} / ${total}</span>
    <span class="chip">${esc(tagName(q.tag))}</span>
    <span class="chip">難易度 ${q.level}</span>
    ${q.gen ? `<span class="chip gen">数値は毎回変わります</span>` : ``}
  </div>
  <div class="card">
    <p class="stem">${esc(q.stem)}${q.give ? `<span class="give">${nl(q.give)}</span>` : ``}</p>
    ${q.giveHtml ? `<div class="gtab">${q.giveHtml}</div>` : ``}
    <ul class="choices" id="choices">
      ${q.choices.map((c,i)=>`<li><button class="ch" data-i="${i}"><span class="n">${i+1}</span><span class="t">${esc(c)}</span></button></li>`).join("")}
    </ul>
  </div>`;
}

function wireChoices(handler){
  document.querySelectorAll("#choices .ch").forEach(b =>
    b.addEventListener("click", () => handler(Number(b.dataset.i)), {once:false}));
}

function revealAnswer(q, chosen){
  const btns = [...document.querySelectorAll("#choices .ch")];
  btns.forEach((b,i) => {
    b.disabled = true;
    if(i === q.answer) b.classList.add("ok");
    else if(i === chosen) b.classList.add("ng");
    const note = q.why && q.why[i];
    if(note && i !== q.answer){
      const s = document.createElement("span");
      s.className = "note"; s.textContent = note;
      b.querySelector(".t").appendChild(s);
    }
  });
  const ok = chosen === q.answer;
  return `<p class="verdict ${ok?"ok":"ng"}">${ok?"正解":"不正解　正解は "+(q.answer+1)}</p>
          <p class="explain">${nl(q.explain)}</p>`;
}

function onDrillAnswer(chosen){
  const d = state.drill;
  if(d.answered) return;
  d.answered = true;
  const q = d.cur, ok = chosen === q.answer;
  const p = state.progress[q.tag];
  p.seen++; if(ok) p.correct++;
  if(d.lec && state.lecProgress[d.lec]){
    const lp = state.lecProgress[d.lec];
    lp.seen++; if(ok) lp.correct++;
  }
  if(!ok && !state.wrong.some(w => w.id===q.id && w.stem===q.stem)) state.wrong.push(q);
  save();

  const last = d.i >= d.queue.length-1;
  document.getElementById("after").innerHTML = revealAnswer(q, chosen) + `
    <div class="row" style="margin-top:18px">
      <button class="btn primary" id="next">${last ? (d.lec ? "終えてホームにもどる" : "終えて難易度の選択にもどる") : "次の問題"}</button>
    </div>`;
  document.getElementById("next").addEventListener("click", () => {
    if(last){ d.lec ? go("home") : go("level"); return; }
    d.i++; d.cur = materialize(d.queue[d.i]); d.answered = false; go("drill");
  });
}

function onReviewAnswer(chosen){
  const d = state.drill;
  if(d.answered) return;
  d.answered = true;
  const q = d.cur, ok = chosen === q.answer;
  if(ok) state.wrong = state.wrong.filter(w => !(w.id===q.id && w.stem===q.stem));
  save();
  const last = d.i >= d.list.length-1;
  document.getElementById("after").innerHTML = revealAnswer(q, chosen) +
    (ok ? `<p class="hint">正解したので、この問題は復習リストから外しました。</p>` : ``) + `
    <div class="row" style="margin-top:18px">
      <button class="btn primary" id="next">${last ? "復習を終える" : "次の問題"}</button>
    </div>`;
  document.getElementById("next").addEventListener("click", () => {
    if(last){ go("home"); return; }
    d.i++; d.cur = d.list[d.i]; d.answered = false; go("review");
  });
}

/* ---- 模試 ---- */
let timerId = null;
function startExam(){
  const pool = BANK.filter(q => q.level !== "C");   // 応用問題は本試験の難易度から外れるため模試には含めない
  const qs = shuffle(pool).slice(0, Math.min(20, pool.length)).map(materialize);
  state.exam = {qs, i:0, picks:new Array(qs.length).fill(null), left:20*60, running:true};
  startTimer();
  go("exam");
}
function startTimer(){
  stopTimer();
  timerId = setInterval(() => {
    const e = state.exam;
    if(!e || !e.running) return stopTimer();
    e.left--;
    paintTimer();
    if(e.left <= 0){ finishExam(); }
  }, 1000);
  paintTimer();
}
function stopTimer(){ if(timerId){ clearInterval(timerId); timerId = null; } }
function paintTimer(){
  const e = state.exam; if(!e) return;
  const m = Math.max(0, Math.floor(e.left/60)), s = Math.max(0, e.left%60);
  timerEl.textContent = "残り " + m + ":" + String(s).padStart(2,"0");
  timerEl.classList.toggle("low", e.left <= 120);
}

function viewExam(){
  const e = state.exam, q = e.qs[e.i];
  barTitle.textContent = "模試";
  timerEl.hidden = false;
  const last = e.i >= e.qs.length-1;
  app.innerHTML = questionHTML(q, e.i+1, e.qs.length) + `
    <p class="hint">正誤と解説は、全問終えたあとにまとめて表示します。</p>
    <div class="row" style="margin-top:16px">
      <button class="btn primary" id="next">${last ? "解答を終えて採点する" : "次の問題"}</button>
      ${e.i>0 ? `<button class="btn" id="prev"><b>前の問題にもどる</b></button>` : ``}
    </div>`;
  document.querySelectorAll("#choices .ch").forEach(b => {
    if(Number(b.dataset.i) === e.picks[e.i]) b.classList.add("picked");
    b.addEventListener("click", () => {
      e.picks[e.i] = Number(b.dataset.i);
      document.querySelectorAll("#choices .ch").forEach(x=>x.classList.remove("picked"));
      b.classList.add("picked");
    });
  });
  document.getElementById("next").addEventListener("click", () => {
    if(last){ finishExam(); return; }
    e.i++; go("exam");
  });
  const pv = document.getElementById("prev");
  if(pv) pv.addEventListener("click", () => { e.i--; go("exam"); });
}

function finishExam(){
  const e = state.exam;
  e.running = false; stopTimer();
  e.qs.forEach((q,i) => {
    const p = state.progress[q.tag];
    p.seen++;
    if(e.picks[i] === q.answer) p.correct++;
    else if(!state.wrong.some(w => w.id===q.id && w.stem===q.stem)) state.wrong.push(q);
  });
  const correct = e.qs.filter((q,i)=>e.picks[i]===q.answer).length;
  state.log.unshift({
    date:new Date().toLocaleDateString("ja-JP")+" "+new Date().toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"}),
    correct, total:e.qs.length
  });
  state.log = state.log.slice(0,10);
  save();
  go("examResult");
}

function viewExamResult(){
  const e = state.exam;
  barTitle.textContent = "模試の結果";
  timerEl.hidden = true;
  const correct = e.qs.filter((q,i)=>e.picks[i]===q.answer).length;
  const byTag = {};
  e.qs.forEach((q,i)=>{
    byTag[q.tag] = byTag[q.tag] || {n:0,c:0};
    byTag[q.tag].n++; if(e.picks[i]===q.answer) byTag[q.tag].c++;
  });
  const bars = Object.keys(byTag).map(t=>{
    const b = byTag[t], r = Math.round(b.c/b.n*100);
    return `<div class="bar-row">
      <div class="lab"><span>${esc(tagName(t))}</span><span>${b.c}/${b.n}（${r}％）</span></div>
      <div class="track"><i style="width:${Math.max(2,r)}%"></i></div>
    </div>`;
  }).join("");

  const used = 20*60 - Math.max(0,e.left);
  const report = "ERE対策マクロ演習　模試の結果\n"
    + (state.sid ? "学籍番号：" + state.sid + "\n" : "")
    + "日時：" + new Date().toLocaleString("ja-JP") + "\n"
    + "得点：" + correct + " / " + e.qs.length + "（" + Math.round(correct/e.qs.length*100) + "％）\n"
    + "所要時間：" + Math.floor(used/60) + "分" + (used%60) + "秒\n"
    + Object.keys(byTag).map(t=>"　"+tagName(t)+"："+byTag[t].c+"/"+byTag[t].n).join("\n") + "\n"
    + "誤答した問題番号：" + (e.qs.map((q,i)=>e.picks[i]===q.answer?null:(i+1)).filter(Boolean).join("、") || "なし");

  const review = e.qs.map((q,i)=>{
    const ok = e.picks[i]===q.answer;
    const picked = e.picks[i]===null ? "未解答" : "あなたの解答 "+(e.picks[i]+1);
    return `<div class="qmeta"><span class="chip no">問${i+1}</span><span class="chip">${esc(tagName(q.tag))}</span>
      <span class="chip" style="${ok?"color:var(--correct);border-color:var(--correct)":"color:var(--wrong);border-color:var(--wrong)"}">${ok?"正解":"不正解"}</span></div>
      <div class="card">
        <p class="stem">${esc(q.stem)}${q.give?`<span class="give">${nl(q.give)}</span>`:``}</p>
        ${q.giveHtml ? `<div class="gtab">${q.giveHtml}</div>` : ``}
        <ul class="choices">${q.choices.map((c,j)=>`<li><button class="ch" disabled ${j===q.answer?'style="border-color:var(--correct);background:var(--correct-soft)"':(j===e.picks[i]?'style="border-color:var(--wrong);background:var(--wrong-soft)"':'')}><span class="n">${j+1}</span><span class="t">${esc(c)}${(q.why&&q.why[j]&&j!==q.answer)?`<span class="note">${esc(q.why[j])}</span>`:``}</span></button></li>`).join("")}</ul>
        <p class="verdict ${ok?"ok":"ng"}">正解 ${q.answer+1}　／　${picked}</p>
        <p class="explain">${nl(q.explain)}</p>
      </div>`;
  }).join("");

  app.innerHTML = `
    <div class="hero" style="padding-bottom:6px">
      <div class="score">${correct}<small> / ${e.qs.length}</small></div>
      <p>所要時間 ${Math.floor(used/60)}分${used%60}秒${e.left<=0?"（時間切れで終了）":""}</p>
    </div>
    <div class="bars">${bars}</div>
    <div class="sec">結果を提出する</div>
    <textarea id="report" readonly>${esc(report)}</textarea>
    <div class="row" style="margin-top:10px">
      <button class="btn" id="copy"><b>結果をコピーする</b><span>Classroomの提出欄に貼り付けてください</span></button>
    </div>
    <div class="sec">解説</div>
    ${review}
    <div class="row" style="margin-top:24px">
      <button class="btn primary" id="home">ホームにもどる</button>
    </div>`;
  document.getElementById("home").addEventListener("click", ()=>go("home"));
  document.getElementById("copy").addEventListener("click", function(){
    const ta = document.getElementById("report");
    ta.select(); ta.setSelectionRange(0, 99999);
    let done = false;
    try{ done = document.execCommand("copy"); }catch(err){ done = false; }
    if(!done && navigator.clipboard){ navigator.clipboard.writeText(ta.value).then(()=>{}); done = true; }
    this.querySelector("b").textContent = done ? "コピーしました" : "上の文章を選んでコピーしてください";
  });
}

/* ---- 公式シート ---- */
function viewSheet(){
  barTitle.textContent = "公式シート";
  app.innerHTML = `
  <div class="hero" style="padding-bottom:4px"><h1>公式シート</h1>
  <p>この2分野で使う定義と公式です。演習中に迷ったらここにもどってください。</p></div>
  <div class="fs">
    <h3>国民経済計算</h3>
    <dl>
      <dt>支出面の恒等式</dt><dd>Y ＝ C ＋ I ＋ G ＋ （X − M）</dd>
      <dt>国民総所得</dt><dd>GNI ＝ GDP ＋ 海外からの純要素所得<em>GDPは国内概念、GNIは国民（居住者）概念</em></dd>
      <dt>国内純生産</dt><dd>NDP ＝ GDP − 固定資本減耗</dd>
      <dt>要素費用表示の国民所得</dt><dd>NI ＝ NNP − 間接税 ＋ 補助金</dd>
      <dt>分配面のGDP</dt><dd>雇用者報酬 ＋ 営業余剰・混合所得 ＋ 固定資本減耗 ＋ （生産・輸入品に課される税 − 補助金）</dd>
      <dt>総と純、国内と国民</dt><dd>NDP ＝ GDP − 固定資本減耗<br>GNI ＝ GDP ＋ 海外からの所得の純受取<br>NNI ＝ GNI − 固定資本減耗<em>「総か純か」は固定資本減耗、「国内か国民か」は海外からの純所得で切り替わる</em></dd>
      <dt>国内総所得</dt><dd>実質GDI ＝ 実質GDP ＋ 交易利得<em>名目では交易利得は定義されず、名目GDIは名目GDPに一致する</em></dd>
      <dt>貯蓄投資バランス</dt><dd>S − I ＝ （G − T） ＋ （X − M）<em>民間の貯蓄超過＝財政赤字＋経常黒字</em></dd>
      <dt>GDPは付加価値の合計</dt><dd>付加価値 ＝ 産出額 − 中間投入<em>合計すると最終生産物の価額に一致する</em></dd>
    </dl>
    <h3>物価と実質化</h3>
    <dl>
      <dt>GDPデフレーター</dt><dd>名目GDP ÷ 実質GDP × 100<em>当期のバスケットで加重するパーシェ型。輸入品は直接には入らない</em></dd>
      <dt>消費者物価指数</dt><dd>基準年のバスケットで加重するラスパイレス型<em>家計が買うものが対象で、輸入品を含む</em></dd>
      <dt>実質成長率の近似</dt><dd>実質成長率 ≒ 名目成長率 − デフレーター上昇率</dd>
      <dt>名目GDPと実質GDP</dt><dd>名目 ＝ Σ（比較年の価格 × 比較年の数量）<br>実質 ＝ Σ（基準年の価格 × 比較年の数量）</dd>
    </dl>
    <h3>IS-LM分析</h3>
    <dl>
      <dt>IS曲線</dt><dd>Y ＝ （C₀ ＋ I₀ ＋ G − br） ÷ （1 − c）<em>財市場の均衡。右下がり。利子率の項にも乗数がかかる</em></dd>
      <dt>LM曲線</dt><dd>Y ＝ （M/P ＋ hr） ÷ k<em>貨幣市場の均衡。右上がり</em></dd>
      <dt>傾きと弾力性</dt><dd>投資の利子弾力性が大きいほどISは緩やか<br>貨幣需要の利子弾力性が大きいほどLMは緩やか</dd>
      <dt>IS-LMの政府支出乗数</dt><dd>1 ÷ ｛（1 − c） ＋ bk/h｝<em>45度線分析の 1/(1−c) より小さい。差がクラウディングアウト</em></dd>
      <dt>極端なケース</dt><dd>LM水平（流動性のわな）：財政政策が最大、金融政策は無効<br>LM垂直：財政政策は無効（完全なクラウディングアウト）<br>IS垂直（投資が利子率に無反応）：金融政策は無効</dd>
    </dl>
    <h3>産業連関表（応用）</h3>
    <dl>
      <dt>需給バランス</dt><dd>x ＝ Ax ＋ f<em>生産額＝中間需要＋最終需要</em></dd>
      <dt>生産誘発</dt><dd>x ＝ （I − A）⁻¹ f<em>最終需要が1増えると、波及を含めて1より大きい生産が誘発される</em></dd>
      <dt>価格モデル</dt><dd>各部門の価格上昇率 ＝ Σ（投入物の費用シェア × その投入物の価格上昇率）<em>輸入原材料の値上がりは、直接使う分と他部門を経由する分の両方で効く</em></dd>
    </dl>
    <h3>45度線分析と乗数</h3>
    <dl>
      <dt>均衡国民所得</dt><dd>Y ＝ （C₀ ＋ I ＋ G） ÷ （1 − c）<em>独立支出の合計 × 乗数</em></dd>
      <dt>投資乗数・政府支出乗数</dt><dd>1 ÷ （1 − c）</dd>
      <dt>減税乗数</dt><dd>− c ÷ （1 − c）<em>絶対値は政府支出乗数より小さい</em></dd>
      <dt>均衡予算乗数</dt><dd>1<em>cの値によらずつねに1</em></dd>
      <dt>定額税がある場合</dt><dd>Y ＝ （C₀ − cT ＋ I ＋ G） ÷ （1 − c）<em>独立支出を下げるのは T ではなく cT</em></dd>
      <dt>比例所得税がある場合</dt><dd>1 ÷ ｛1 − c（1 − t）｝<em>税率が高いほど乗数は小さい（ビルトイン・スタビライザー）</em></dd>
      <dt>デフレギャップ</dt><dd>（Yf − Y） × （1 − c）<em>所得の不足額そのものではなく、必要な需要の追加額</em></dd>
    </dl>
    <p class="hint">開放経済の乗数 1 ÷ （1 − c ＋ m） は、国際マクロの分野で扱います。</p>
  </div>
  <div class="row" style="margin-top:26px"><button class="btn primary" id="home">ホームにもどる</button></div>`;
  document.getElementById("home").addEventListener("click", ()=>go("home"));
}

load();
go("home");
