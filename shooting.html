<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>マクロ シューティング</title>
<style>
:root{
  --bg:#0f1b2b; --panel:#17263a; --panel2:#1e3149; --line:#2c4059;
  --ink:#eaf2fa; --sub:#a8bdd4; --accent:#ffd166; --ok:#4ade80; --ng:#fb7185;
  --todo:#dfe7ef; --dim:#3a4c63;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:radial-gradient(120% 80% at 50% 0%,#1b2f49 0%,var(--bg) 60%);
  color:var(--ink); font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
  overscroll-behavior:none; -webkit-text-size-adjust:100%;
}
.app{max-width:600px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:10px 12px 18px}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none}
.hide{display:none!important}

/* ---------- ヘッダ ---------- */
.top{display:flex;align-items:center;gap:8px;margin-bottom:8px;min-height:38px}
.top h1{font-size:19px;margin:0;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sp{flex:1}
.iconbtn{width:38px;height:38px;border-radius:12px;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-size:17px;border:1px solid var(--line)}
.iconbtn.on{background:var(--accent);color:#20304a;border-color:var(--accent)}
.backbtn{padding:0 13px;height:38px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-size:14px;font-weight:700}

/* ---------- ホーム ---------- */
.lead{color:var(--sub);font-size:13px;line-height:1.7;margin:0 0 10px}
.homemap{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:6px;margin-bottom:12px}
.cards{display:flex;flex-direction:column;gap:9px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:11px 12px;display:flex;align-items:center;gap:11px}
.card.locked{opacity:.5}
.dot{width:15px;height:15px;border-radius:5px;flex:none}
.cname{font-weight:800;font-size:16px;line-height:1.15}
.cname small{display:block;font-weight:500;font-size:10.5px;color:var(--sub);margin-top:2px}
.card .sp{flex:1}
.stars{font-size:13px;letter-spacing:1px;margin-right:2px;color:var(--accent)}
.go{padding:9px 12px;border-radius:11px;font-size:13.5px;font-weight:800;background:var(--panel2);border:1px solid var(--line)}
.go.a{background:linear-gradient(180deg,#5eead4,#2dd4bf);color:#0a2b28;border-color:#2dd4bf}
.go.b{background:linear-gradient(180deg,#fbbf6b,#f59e0b);color:#3a2205;border-color:#f59e0b}
.go[disabled]{background:#22334a;color:#63799a;border-color:#2c4059;cursor:default}
.card.final{background:linear-gradient(135deg,#2a3f5f,#1c2c44);border-color:#3d5878}
.drill{width:100%;margin-top:11px;padding:13px;border-radius:15px;font-weight:800;font-size:14.5px;
  background:linear-gradient(180deg,#fb7185,#e11d48);color:#fff;border:1px solid #e11d48}
.tot{font-size:12px;color:var(--sub);text-align:center;margin-top:12px;line-height:1.7}
.resetbtn{display:block;margin:8px auto 0;padding:7px 14px;border-radius:10px;font-size:11.5px;
  background:transparent;border:1px solid var(--line);color:var(--sub)}

/* ---------- ゲーム ---------- */
.bar{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--sub);margin-bottom:6px}
.prog{flex:1;height:8px;border-radius:99px;background:#25374e;overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#5eead4,#ffd166);border-radius:99px;transition:width .35s}
.scorebox{display:flex;gap:6px;align-items:baseline}
.scorebox b{font-size:16px;color:var(--ink)}
.combo{font-size:12px;font-weight:800;color:var(--accent);opacity:0;transition:opacity .2s,transform .2s;transform:scale(.7)}
.combo.on{opacity:1;transform:scale(1)}

.mapwrap{position:relative;background:linear-gradient(180deg,#16283e,#12203300);border:1px solid var(--line);border-radius:16px;overflow:hidden;flex:1;min-height:230px}
svg.map{display:block;width:100%;height:100%;touch-action:manipulation}
.mapwrap svg.map{position:absolute;inset:0;width:100%;height:100%}
.homemap{position:relative}
.homemap svg.map{height:44vh;min-height:230px;max-height:460px}
svg.map path{stroke:#0e1a29;stroke-width:1.1;stroke-linejoin:round;vector-effect:non-scaling-stroke;transition:fill .25s}
path.dim{fill:var(--dim);opacity:.45}
path.todo{fill:var(--todo)}
path.done{stroke:#fff;stroke-width:1.3}
path.target{animation:pulse 1.1s ease-in-out infinite;stroke:#fff;stroke-width:2}
path.pick{cursor:pointer}
@keyframes pulse{0%,100%{fill:#ffd166}50%{fill:#fff3c4}}
path.hit{fill:var(--ok)!important;animation:none}
path.miss{fill:var(--ng)!important;animation:none}
text.lab{font-weight:800;fill:#12233a;stroke:#fff;paint-order:stroke;text-anchor:middle;pointer-events:none;dominant-baseline:middle}
.float{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);font-size:30px;font-weight:900;color:var(--accent);
  text-shadow:0 2px 12px rgba(0,0,0,.6);pointer-events:none;opacity:0}
.float.go{animation:fl 1s ease-out}
@keyframes fl{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-90%) scale(1)}}

.qpanel{margin-top:10px}
.qhead{text-align:center;font-size:12.5px;color:var(--sub);margin-bottom:5px}
.qname{text-align:center;font-size:30px;font-weight:900;letter-spacing:.04em;line-height:1.25;margin-bottom:9px}
.qname rt{font-size:.34em;font-weight:600;color:var(--accent)}
.row{display:flex;gap:8px}
.inp{flex:1;min-width:0;height:52px;border-radius:14px;border:2px solid var(--line);background:#0d1826;color:var(--ink);
  font-size:22px;font-weight:800;text-align:center;font-family:inherit;outline:none}
.inp:focus{border-color:var(--accent)}
.send{width:100px;flex:none;white-space:nowrap;border-radius:14px;font-weight:900;font-size:15.5px;background:linear-gradient(180deg,#5eead4,#2dd4bf);color:#07302c}
.hintbtn{margin-top:8px;width:100%;padding:11px;border-radius:13px;background:var(--panel2);border:1px solid var(--line);font-size:13.5px;font-weight:700;color:var(--sub)}
.msg{min-height:46px;margin-top:8px;text-align:center;font-size:15.5px;font-weight:800;line-height:1.45}
.msg .k{font-size:22px}
.msg rt{font-size:.4em;color:var(--accent)}
.msg.ok{color:var(--ok)} .msg.ng{color:var(--ng)} .msg.tip{color:var(--accent)}

/* ---------- 冒険モード ---------- */
.advbtn{width:100%;margin:0 0 12px;padding:14px;border-radius:16px;font-weight:900;font-size:16px;
  background:linear-gradient(135deg,#7c3aed,#4f46e5);color:#fff;border:1px solid #8b5cf6;
  box-shadow:0 6px 18px rgba(79,70,229,.35);display:flex;align-items:center;justify-content:center;gap:8px}
.advbtn small{display:block;font-size:11px;font-weight:600;opacity:.85;margin-top:3px}
#adv{flex:1;display:flex;flex-direction:column;gap:8px}
.stagepick{display:flex;flex-direction:column;gap:10px}
.stcard{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:13px;display:flex;align-items:center;gap:11px}
.stcard.locked{opacity:.45}
.stcard.secret{background:linear-gradient(135deg,#3d0c1e,#1c0710);border-color:#8f2149;
  box-shadow:0 0 18px rgba(255,93,143,.22)}
.stcard.secret .t{color:#ffd7e3}
.stcard .n{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:900;flex:none;color:#0d1a2a}
.stcard .t{font-weight:800;font-size:15.5px}
.stcard .t small{display:block;font-weight:500;font-size:11px;color:var(--sub);margin-top:3px}
.cvwrap{position:relative;width:100%;background:#05070f;border:1px solid var(--line);border-radius:14px;overflow:hidden;touch-action:none}
#cv{display:block;width:100%;height:auto}
.hud{display:flex;align-items:center;gap:5px;flex-wrap:nowrap;font-size:11px;color:var(--sub);padding:2px 2px 0}
.pill{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:3px 7px;font-weight:800;color:var(--ink);font-size:11px;white-space:nowrap}
.pill.w{background:#123b46;border-color:#1c5e6f;color:#9ef2ff}
.pill.p{background:#3b3312;border-color:#6f5b1c;color:#ffe08a}
.pill.b{background:#12233b;border-color:#1c456f;color:#9ecbff}
.pill.o{background:#2c1240;border-color:#5a1c6f;color:#e2a8ff}
.ovl{position:fixed;inset:0;z-index:60;background:rgba(6,10,20,.96);display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:16px;text-align:center;gap:10px;overflow-y:auto}
.ovl h3{margin:0;font-size:20px;font-weight:900}
.ovl .it{font-size:14px;color:var(--accent);font-weight:800}
.qmap{width:min(78vw,340px);height:min(34vh,270px);background:#0d1826;border-radius:14px;border:1px solid var(--line);padding:6px}
.qmap svg{width:100%;height:100%}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:7px;width:100%;max-width:340px}
.ch{padding:11px 6px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-size:16px;font-weight:800}
.ch rt{font-size:.4em;color:var(--accent)}
.ch.ok{background:#14532d;border-color:#22c55e}
.ch.no{background:#4c0519;border-color:#f43f5e}
.ovl .row{width:100%;max-width:340px}
.ovl .send{width:86px;font-size:14px}
.ovl .inp{height:48px;font-size:20px}
.ovl .msg{min-height:0;font-size:14px}
.bigmsg{font-size:26px;font-weight:900}
.ctl{display:flex;gap:8px}
.ctl button{flex:1;padding:12px;border-radius:13px;font-weight:800;font-size:14px;background:var(--panel2);border:1px solid var(--line)}
.ctl button.p{background:linear-gradient(180deg,#5eead4,#2dd4bf);color:#07302c;border-color:#2dd4bf}
.tips{font-size:11.5px;color:var(--sub);line-height:1.7;text-align:center}

/* ---------- リザルト ---------- */
.res{text-align:center;padding:6px 0}
.res .big{font-size:44px;font-weight:900;margin:6px 0 2px}
.res .rank{font-size:24px;font-weight:900;color:var(--accent);margin-bottom:6px}
.res .sub{color:var(--sub);font-size:13.5px;line-height:1.8}
.chips{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin:12px 0}
.chip{background:#3b2233;border:1px solid #6b3a4f;color:#ffd6e0;border-radius:10px;padding:7px 10px;font-size:13.5px;font-weight:700}
.chip rt{font-size:.42em;color:#ffb4c6}
.acts{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.act{padding:14px;border-radius:15px;font-weight:800;font-size:15px;background:var(--panel2);border:1px solid var(--line)}
.act.p{background:linear-gradient(180deg,#5eead4,#2dd4bf);color:#07302c;border-color:#2dd4bf}
.act.w{background:linear-gradient(180deg,#fb7185,#e11d48);color:#fff;border-color:#e11d48}
</style>
<style>
  /* 出題範囲えらび */
  .rangebtn{width:100%;display:block;text-align:left;background:var(--panel);border:1px solid var(--line);
    color:var(--text);border-radius:14px;padding:11px 14px;font:inherit;font-size:14px;cursor:pointer;margin-bottom:8px}
  .rangebtn b{color:var(--accent)}
  .rangebtn span{color:var(--sub);font-size:12px}
  .rangebtn:hover{border-color:var(--accent)}
  .rgroup{font-size:12px;color:var(--sub);margin:14px 0 6px;letter-spacing:.06em}
  .ritem{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:var(--panel);
    border:1px solid var(--line);color:var(--text);border-radius:14px;padding:12px 14px;font:inherit;
    font-size:14px;cursor:pointer;margin-bottom:7px;line-height:1.5}
  .ritem .bx{flex:none;width:23px;height:23px;border-radius:7px;border:2px solid var(--line);
    display:grid;place-items:center;font-size:14px;font-weight:900;color:#0b1026}
  .ritem.on{border-color:var(--accent)}
  .ritem.on .bx{background:var(--accent);border-color:var(--accent)}
  .ritem small{display:block;color:var(--sub);font-size:11.5px;margin-top:2px}
  .rnum{flex:none;color:var(--sub);font-size:12px}
  .rwarn{color:var(--bad);font-size:12.5px;min-height:1.4em;margin:2px 0 8px}
  /* 問題オーバーレイ */
  .ovl .qstem{font-size:14.5px;line-height:1.75;text-align:left;width:100%;max-width:440px;margin:2px auto 0}
  .ovl .gtab{width:100%;max-width:440px;margin:8px auto 0;overflow-x:auto}
  .ovl .gtab table{width:100%;border-collapse:collapse;font-size:12px}
  .ovl .gtab th,.ovl .gtab td{border:1px solid var(--line);padding:4px 6px;text-align:right}
  .ovl .gtab th{background:rgba(255,255,255,.06);text-align:center;color:var(--sub)}
  .ovl .gtab tr>th:first-child{text-align:left;white-space:nowrap}
  .ovl .choices{display:flex;flex-direction:column;gap:6px;width:100%;max-width:440px;margin:10px auto 0}
  .ovl .ch{text-align:left;line-height:1.55;font-size:13.5px;padding:9px 12px;white-space:normal}
  .ovl .why{display:block;color:var(--sub);font-size:11.5px;margin-top:4px}
  .ovl .qtag{font-size:11px;color:var(--sub);margin-bottom:2px}
  .ovl .cont{margin-top:10px}
  .ovlscroll{overflow-y:auto}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <button class="backbtn hide" id="back">‹ もどる</button>
    <h1 id="ttl">マクロ シューティング</h1>
    <div class="sp"></div>
    <a class="iconbtn" id="tohome" href="index.html" title="演習にもどる">📚</a>
    <button class="iconbtn on" id="snd" title="おと">♪</button>
  </div>

  <!-- 出題範囲えらび -->
  <div id="range">
    <p class="lead">敵をたおして出てきたアイテムを取ると、<b>マクロ経済学の問題</b>が出ます。<br>
      まず、どこから出題するかをえらんでください。<b>1つ以上</b>えらぶ必要があります。</p>
    <div id="rlist"></div>
    <div class="rwarn" id="rwarn"></div>
    <button class="advbtn" id="rgo">⚔️ <span>この範囲ではじめる<small id="rsum"></small></span></button>
  </div>

  <!-- ステージえらび＋ゲーム -->
  <div id="adv" class="hide">
    <div id="stagepick" class="stagepick"></div>
    <div id="advplay" class="hide" style="flex:1;display:flex;flex-direction:column;gap:8px;min-height:0">
      <div class="hud">
        <span class="pill w" id="hWeapon">散弾銃</span>
        <span class="pill p" id="hPower">POW 1</span>
        <span class="pill b" id="hBarrier">バリア 0</span>
        <span class="pill o" id="hOpt">分身 0</span>
        <span style="flex:1"></span>
        <span class="pill" id="hScore">0</span>
      </div>
      <div class="cvwrap" id="cvwrap">
        <canvas id="cv" width="480" height="300"></canvas>
        <div class="ovl hide" id="ovl"></div>
      </div>
      <div class="tips">画面を指でなぞって（PCは矢印キーで）動かそう。たまは自動でうつよ。<br>
        敵をたおすと出るアイテムを取ると<b>問題</b>！ 正解でパワーアップ。</div>
    </div>
  </div>
</div>
<script src="questions.js"></script>
<script>
"use strict";
const $ = id => document.getElementById(id);

/* ========== 状態と保存 ========== */
const SKEY='macro-shooting-v1';
const S = { snd:true, total:0, weak:new Set(), ranges:null };
let advCleared={};
function saveState(){
  try{ localStorage.setItem(SKEY, JSON.stringify({
    v:1, snd:S.snd, total:S.total, weak:[...S.weak], ranges:[...sel], adv:advCleared })); }catch(e){}
}
function loadState(){
  try{
    const d=JSON.parse(localStorage.getItem(SKEY)||'null'); if(!d) return;
    S.snd=d.snd!==false; S.total=d.total||0;
    (d.weak||[]).forEach(x=>S.weak.add(x));
    if(Array.isArray(d.ranges)&&d.ranges.length) S.ranges=d.ranges;
    advCleared=d.adv||{};
  }catch(e){}
}
/* ================= 音 ================= */
let AC=null;
function beep(seq){
  if(!S.snd) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended') AC.resume();
    let t = AC.currentTime;
    seq.forEach(([f,d,v=.16,type='triangle'])=>{
      const o=AC.createOscillator(), g=AC.createGain();
      o.type=type; o.frequency.value=f;
      g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v,t+.012);
      g.gain.exponentialRampToValueAtTime(.0008,t+d);
      o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+d+.02); t+=d*0.85;
    });
  }catch(e){}
}
const sOK   = ()=>beep([[784,.11],[1175,.20]]);
const sNG   = ()=>beep([[196,.16,.14,'sawtooth'],[147,.26,.12,'sawtooth']]);
const sTAP  = ()=>beep([[523,.06,.08]]);
const sCLR  = ()=>beep([[523,.11],[659,.11],[784,.11],[1047,.30]]);
const sPERF = ()=>beep([[659,.10],[784,.10],[988,.10],[1319,.12],[1568,.34]]);

let CVW=480, CVH=300;
function sizeCanvas(){
  const w=$('cvwrap').clientWidth||400;
  const top=$('cvwrap').getBoundingClientRect().top;
  const avail=Math.max(220,(window.innerHeight||600)-top-78);
  const h=Math.min(avail, w*1.0);
  CVW=480; CVH=Math.round(Math.max(255,Math.min(470, 480*h/w)));
  cv.width=CVW; cv.height=CVH; }

/* ========================================================
   出題範囲（index.html のホーム画面と同じ区分）
   ======================================================== */
const RANGES = [].concat(
  LECTURES.map(l=>({id:l.id, kind:'lec', name:l.label+'　'+l.title, sub:l.sub})),
  TAGS.map(t=>({id:t.id, kind:'tag', name:t.name, sub:t.topics}))
);
const rangeCount = r => BANK.filter(q => r.kind==='lec' ? q.lec===r.id : q.tag===r.id).length;

const sel = new Set();
RANGES.forEach(r=>sel.add(r.id));          // 初期値はすべて
if(S.ranges){ sel.clear(); S.ranges.forEach(x=>{ if(RANGES.some(r=>r.id===x)) sel.add(x); }); }
if(!sel.size) RANGES.forEach(r=>sel.add(r.id));

function poolAll(){
  const ids=new Set(), out=[];
  BANK.forEach(q=>{
    const hit = RANGES.some(r=> sel.has(r.id) && (r.kind==='lec' ? q.lec===r.id : q.tag===r.id));
    if(hit && !ids.has(q.id)){ ids.add(q.id); out.push(q); }
  });
  return out;
}
function rangeLabel(){
  if(sel.size===RANGES.length) return 'すべて';
  const names=RANGES.filter(r=>sel.has(r.id)).map(r=>r.kind==='lec'?r.name.split('　')[0]:r.name);
  return names.length<=2 ? names.join('、') : names[0]+' ほか'+(names.length-1)+'件';
}

function showRange(){
  $('adv').classList.add('hide'); $('range').classList.remove('hide');
  $('back').classList.add('hide'); $('ttl').textContent='\ud83c\udfaf 出題範囲';
  advStop();
  const wrap=$('rlist'); wrap.innerHTML='';
  let kind='';
  RANGES.forEach(r=>{
    if(r.kind!==kind){
      kind=r.kind;
      const h=document.createElement('div'); h.className='rgroup';
      h.textContent = kind==='lec' ? '講義回から' : '分野から';
      wrap.appendChild(h);
    }
    const b=document.createElement('button');
    b.className='ritem'+(sel.has(r.id)?' on':'');
    b.innerHTML='<span class="bx">'+(sel.has(r.id)?'\u2713':'')+'</span>'
      + '<span style="flex:1">'+r.name+'<small>'+(r.sub||'')+'</small></span>'
      + '<span class="rnum">'+rangeCount(r)+'問</span>';
    b.onclick=()=>{
      if(sel.has(r.id)){
        if(sel.size<=1){ $('rwarn').textContent='出題範囲は 1つ以上 えらんでください。'; sNG(); return; }
        sel.delete(r.id);
      } else sel.add(r.id);
      $('rwarn').textContent=''; sTAP(); saveState(); showRange();
    };
    wrap.appendChild(b);
  });
  $('rsum').textContent = rangeLabel()+'（'+poolAll().length+'問）';
}
$('rgo').onclick=()=>{
  if(!sel.size){ $('rwarn').textContent='出題範囲は 1つ以上 えらんでください。'; return; }
  saveState(); advHome();
};

/* ========================================================
   出題
   ======================================================== */
function pickQ(){
  const pool=poolAll();
  const weak=pool.filter(q=>S.weak.has(q.id));

function step(dt){
  const p=A.p; A.t+=dt; A.scroll+=dt*60; if(A.msgT>0) A.msgT-=dt;
  // 自機
  if(A.ptr){ p.x+=(A.ptr.x-p.x)*Math.min(1,dt*11); p.y+=(A.ptr.y-p.y)*Math.min(1,dt*11); }
  const sp=210;

  if(A.keys.ArrowLeft)p.x-=sp*dt; if(A.keys.ArrowRight)p.x+=sp*dt;
  p.x=Math.max(14,Math.min(CVW-24,p.x)); p.y=Math.max(12,Math.min(CVH-12,p.y));
  p.trail.unshift({x:p.x,y:p.y}); if(p.trail.length>40) p.trail.pop();

  p.cd-=dt; if(p.cd<=0){ fire(); p.cd=WEAP[p.weapon].cd; }

      let tg=null,bd=1e9; A.es.concat(A.boss?[A.boss]:[]).forEach(e=>{const d=Math.hypot(e.x-b.x,e.y-b.y); if(e.x>b.x&&d<bd){bd=d;tg=e;}});
      if(tg){ const a=Math.atan2(tg.y-b.y,tg.x-b.x), ca=Math.atan2(b.vy,b.vx);
        let na=ca+Math.max(-2.6*dt,Math.min(2.6*dt,((a-ca+Math.PI*3)%(Math.PI*2))-Math.PI));
        const sp2=Math.hypot(b.vx,b.vy); b.vx=Math.cos(na)*sp2; b.vy=Math.sin(na)*sp2; } }
    b.x+=b.vx*dt; b.y+=b.vy*dt; return b.x<CVW+40&&b.x>-40&&b.y>-30&&b.y<CVH+30&&(b.life===undefined||b.life>0); });
  // 敵
  if(!A.boss){ A.waveT-=dt; if(A.waveT<=0&&A.es.length<7) spawnWave(); }
  A.es.forEach(e=>{
    e.x+=e.vx*dt; e.ph+=dt*2; e.y+=Math.sin(e.ph)*e.amp*dt;
    e.y=Math.max(14,Math.min(CVH-14,e.y));
    if(e.fire!==undefined){ e.fire-=dt; if(e.fire<=0&&e.x<CVW){ e.fire=1.5+Math.random()*1.2;
      const a=Math.atan2(p.y-e.y,p.x-e.x); A.eb.push({x:e.x,y:e.y,vx:Math.cos(a)*135,vy:Math.sin(a)*135,r:4}); } }
  });
  A.es=A.es.filter(e=>e.x>-50);
  // ボス
  if(A.boss){ const B=A.boss;
    if(B.ent>0){ const tx=B.tb?CVW*(B.tb===2?0.655:0.70):CVW-70;
      B.x+=(tx-B.x)*Math.min(1,dt*2.4); if(Math.abs(B.x-tx)<6){ B.x=tx; B.ent=0; } }
    else if(B.tb){ // 裏ボス
      const two = B.tb===2;
      B.an+=dt; if(B.hitfx>0) B.hitfx-=dt;
      B.y+=B.vy*dt; if(B.y<B.h/2+6||B.y>CVH-B.h/2-6) B.vy*=-1;
      if(two){ B.x = CVW*0.655 + Math.sin(B.an*0.7)*22; } else { B.x = CVW*0.70 + Math.sin(B.an*0.5)*14; }
      const r=Math.max(0,B.hp/B.max), lv = r>0.66?0 : r>0.33?1 : 2;   // 体力で3段階に激化
      // --- ストリーム処理 ---
      B.str=B.str.filter(st=>{
        st.cd-=dt;
        let guard=0;
        while(st.cd<=0 && st.left>0 && guard++<12){
          st.cd+=st.every; st.left--;
          const base = st.aim ? Math.atan2(p.y-B.y,p.x-B.x) : st.ang;
          for(let i=0;i<st.n;i++){
            const a = st.fan ? base+(i-(st.n-1)/2)*st.spread : base + i*Math.PI*2/st.n;
            ebPush({x:B.x+st.ox,y:B.y+st.oy,vx:Math.cos(a)*st.sp,vy:Math.sin(a)*st.sp,r:st.r,c:st.c});

        const C = two?'#c084fc':'#ffa64d', C2 = two?'#f472b6':'#ff6b6b';
        const S = (two?135:120) + lv*22;

    // HPバー
    const bw=Math.min(220,CVW-60);
    cx.fillStyle='rgba(0,0,0,.55)'; cx.fillRect(CVW/2-bw/2-3,7,bw+6,13);
    cx.fillStyle='#2a1020'; cx.fillRect(CVW/2-bw/2,10,bw,7);
    cx.fillStyle=B.tb===2?'#c084fc':B.tb===1?'#ff7a2d':'#f43f5e';
    cx.fillRect(CVW/2-bw/2,10,bw*Math.max(0,B.hp/B.max),7);
    cx.strokeStyle=B.tb?'#ffd166':'#888'; cx.lineWidth=1; cx.strokeRect(CVW/2-bw/2,10,bw,7);
    cx.fillStyle='#fff'; cx.font='bold 9px sans-serif'; cx.textAlign='center';
    cx.fillText(B.tb?('👑 '+TB_NAME[B.tb-1]+'　だい'+B.tb+'けいたい'):A.st.boss, CVW/2, 28); }
  // 弾
  A.bs.forEach(b=>{ cx.fillStyle=b.k==='laser'?'#7dff9b':b.k==='rocket'?'#ffa07d':'#8ef0ff';
    cx.fillRect(b.x-b.w/2,b.y-b.h/2,b.w,b.h); });
  A.eb.forEach(b=>{ cx.fillStyle=b.c||'#ff6b81'; cx.beginPath(); cx.arc(b.x,b.y,b.r,0,7); cx.fill();
    cx.fillStyle='rgba(255,255,255,.85)'; cx.beginPath(); cx.arc(b.x-b.r*0.25,b.y-b.r*0.25,b.r*0.4,0,7); cx.fill(); });
  // 分身
  const p=A.p;
  for(let i=0;i<p.opts;i++){ const tr=p.trail[Math.min(p.trail.length-1,(i+1)*11)]; if(!tr)continue;
    cx.save(); cx.translate(tr.x,tr.y); cx.globalAlpha=.85; cx.fillStyle='#c084fc';
    cx.beginPath(); cx.moveTo(9,0); cx.lineTo(-6,-5); cx.lineTo(-6,5); cx.closePath(); cx.fill(); cx.restore(); }
  // 自機
  if(!(p.inv>0&&Math.floor(A.t*18)%2)){
    cx.save(); cx.translate(p.x,p.y);
    cx.fillStyle='#5eead4'; cx.beginPath(); cx.moveTo(15,0); cx.lineTo(-10,-8); cx.lineTo(-5,0); cx.lineTo(-10,8); cx.closePath(); cx.fill();
    cx.fillStyle='#fff'; cx.fillRect(-2,-2,6,4);
    cx.strokeStyle='rgba(255,90,130,.85)'; cx.lineWidth=1.2;
    cx.beginPath(); cx.ellipse(0,0,11.5,8,0,0,7); cx.stroke();
    cx.fillStyle='rgba(255,255,255,.95)'; cx.beginPath(); cx.arc(0,0,2.8,0,7); cx.fill();
    cx.fillStyle='#fbbf24'; cx.fillRect(-14,-2,Math.random()*6+2,4);
    cx.restore();
  }
  for(let i=0;i<p.barrier;i++){ cx.strokeStyle='rgba(96,165,250,'+(0.75-i*0.18)+')'; cx.lineWidth=2;
    cx.beginPath(); cx.arc(p.x,p.y,20+i*5,0,7); cx.stroke(); }
  // パーティクル
  A.fx.forEach(f=>{ cx.globalAlpha=Math.max(0,f.life*2); cx.fillStyle=f.col; cx.fillRect(f.x-2,f.y-2,4,4); });
  cx.globalAlpha=1;
  // バナー
  if(A.msgT>0){ const [a,b]=A.msg.split('|');
    cx.globalAlpha=Math.min(1,A.msgT); cx.textAlign='center';
    cx.fillStyle='#ffd166'; cx.font='bold 30px sans-serif'; cx.fillText(a,CVW/2,CVH/2-6);
    cx.fillStyle='#fff'; cx.font='bold 14px sans-serif'; cx.fillText(b,CVW/2,CVH/2+18); cx.globalAlpha=1; }
}

/* ---------- オーバーレイ／クイズ ---------- */
function hideOvl(){ $('ovl').classList.add('hide'); $('ovl').innerHTML=''; }
function gameOver(){
  const o=$('ovl'); o.classList.remove('hide'); o.dataset.done='';
  o.innerHTML=`<div class="bigmsg" style="color:var(--ng)">GAME OVER</div>
    <div class="sub" style="color:var(--sub)">スコア ${A.score}</div>
    <div class="ctl" style="width:100%;max-width:320px">
      <button class="p" id="oRetry">もういちど</button><button id="oBack">ステージえらび</button></div>`;
  $('oRetry').onclick=()=>{ const si=A.si, m=A.mode; hideOvl(); advStart(si,m); };
  $('oBack').onclick=()=>{ advStop(); advHome(); };
}
function stageClear(){
  A.paused=true; sPERF(); advCleared[A.si]=advCleared[A.si]||{}; advCleared[A.si][A.mode]=true; S.total+=A.score; saveState();
  const o=$('ovl'); o.classList.remove('hide'); o.dataset.done='';
  const next=A.si+1<STAGES.length && !STAGES[A.si+1].hidden;
  const hid=!!A.def.gauntlet;
  const unlockMsg = (!hid && A.si===3) ? '<div style="color:#ff8fb0;font-weight:900;font-size:15px">🔥 隠しステージが あらわれた！</div>' : '';
  o.innerHTML=`<div class="bigmsg" style="color:var(--accent)">${hid?'👑 うらボス げきは！':'STAGE '+A.def.n+' クリア！'}</div>
    <div style="color:var(--sub);font-size:13px">スコア ${A.score}　／　${A.st.boss} をたおした！</div>
    ${hid?'<div style="color:#ffd166;font-weight:900;font-size:16px">きみは マクロ経済学マスターだ！🏆</div>':unlockMsg}
    <div class="ctl" style="width:100%;max-width:320px">
      ${(next&&!hid)?'<button class="p" id="oNext">つぎのステージ ▶</button>':'<button class="p" id="oBack2">やったー！</button>'}
      <button id="oBack">ステージえらび</button></div>`;
  if($('oNext')) $('oNext').onclick=()=>{ const n=A.si+1, m=A.mode; hideOvl(); advStart(n,m); };
  if($('oBack2')) $('oBack2').onclick=()=>{ advStop(); advHome(); };
  $('oBack').onclick=()=>{ advStop(); advHome(); };
}


/* ========== おと ボタン ========== */
$('snd').onclick=()=>{ S.snd=!S.snd; $('snd').classList.toggle('on',S.snd);
  $('snd').textContent=S.snd?'\u266a':'\ud83d\udd07'; if(S.snd) sTAP(); saveState(); };
$('back').onclick=()=>{
  if($('advplay').classList.contains('hide')) showRange();
  else { advStop(); advHome(); }
};
window.addEventListener('resize',()=>{ if(A&&cv){ sizeCanvas(); } });

loadState();
$('snd').classList.toggle('on',S.snd); $('snd').textContent=S.snd?'\u266a':'\ud83d\udd07';
showRange();
</script>
