<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>タイピング だいぼうけん</title>
<style>
  :root{
    --bg:#0b1026;
    --bg2:#131a3a;
    --panel:rgba(255,255,255,.06);
    --line:rgba(255,255,255,.14);
    --text:#eef2ff;
    --sub:#9fb0d8;
    --accent:#ffd54a;
    --good:#4ade80;
    --bad:#f87171;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:radial-gradient(1200px 700px at 50% -10%, #1e2a5e 0%, var(--bg) 55%, #050817 100%);
    color:var(--text);
    font-family:"Hiragino Maru Gothic ProN","ヒラギノ丸ゴ ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif;
    display:flex;flex-direction:column;align-items:center;
    padding:10px 10px 20px;
    -webkit-font-smoothing:antialiased;
    user-select:none;
  }
  #app{width:100%;max-width:1000px}

  /* ---------- HUD ---------- */
  #hud{
    display:flex;flex-wrap:wrap;align-items:center;gap:4px 11px;
    background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:7px 12px;margin-bottom:7px;
  }
  .hud-item{display:flex;align-items:baseline;gap:4px;font-size:12px;color:var(--sub);white-space:nowrap}
  .hud-item b{font-size:19px;color:var(--text);font-variant-numeric:tabular-nums}
  #hudLives{font-size:15px;letter-spacing:0}
  #hudLevel b{color:var(--accent)}
  #hudCombo b{color:#7dd3fc}
  .spacer{flex:1}
  .btn{
    background:linear-gradient(180deg,#3b4ba8,#2b3781);
    border:1px solid rgba(255,255,255,.22);color:#fff;
    border-radius:10px;padding:6px 11px;font-size:13px;font-weight:700;
    cursor:pointer;font-family:inherit;transition:transform .08s, filter .15s;
  }
  .btn:hover{filter:brightness(1.15)}
  .btn:active{transform:translateY(1px)}
  .btn.ghost{background:rgba(255,255,255,.08)}
  .btn.big{font-size:20px;padding:14px 30px;border-radius:14px;
    background:linear-gradient(180deg,#ffb347,#f2820b);color:#3a1f00;text-shadow:0 1px 0 rgba(255,255,255,.4)}

  /* ---------- timer ---------- */
  #hudTime b{font-size:30px;color:#7dd3fc;min-width:46px;text-align:right}
  #hudTime .unit{font-size:12px;color:var(--sub)}
  #hudTime.warn b{color:#f87171;animation:tpulse .5s ease-in-out infinite}
  #hudTime.gain b{color:#4ade80}
  @keyframes tpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.16)}}
  #vDrain{font-size:11px;color:#fbbf24;font-weight:700;margin-left:2px}
  #timeWrap{width:100%;height:14px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden;
    border:1px solid var(--line);margin-bottom:5px}
  #timeBar{height:100%;width:100%;background:linear-gradient(90deg,#38bdf8,#818cf8);
    transition:width .12s linear}
  #timeBar.warn{background:linear-gradient(90deg,#f87171,#fb923c)}

  /* ---------- progress ---------- */
  #goalWrap{width:100%;height:12px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden;
    border:1px solid var(--line);margin-bottom:8px;position:relative}
  #goalWrap.done{border-color:#facc15;box-shadow:0 0 12px rgba(250,204,21,.5)}
  #goalBar{height:100%;width:0%;background:linear-gradient(90deg,#4ade80,#facc15);transition:width .2s}
  #goalTxt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:9px;font-weight:700;color:#0b1026;letter-spacing:.5px}

  /* ---------- stage ---------- */
  #stageWrap{position:relative;width:100%;border-radius:16px;overflow:hidden;
    border:1px solid var(--line);box-shadow:0 20px 60px rgba(0,0,0,.5)}
  canvas{display:block;width:100%;height:auto;background:#0d1330}

  /* ---------- overlay ---------- */
  #overlay{position:absolute;inset:0;display:flex;align-items:flex-start;justify-content:center;
    background:rgba(6,10,30,.90);backdrop-filter:blur(3px);padding:16px;text-align:center;
    overflow-y:auto;overscroll-behavior:contain}
  #overlay::-webkit-scrollbar{width:8px}
  #overlay::-webkit-scrollbar-thumb{background:rgba(255,255,255,.25);border-radius:8px}
  #overlay.hidden{display:none}
  .card{max-width:780px;width:100%;margin:auto 0}
  .card h1{font-size:clamp(26px,5vw,46px);margin:0 0 6px;color:var(--accent);
    text-shadow:0 4px 0 rgba(0,0,0,.35)}
  .card h2{font-size:clamp(20px,3.6vw,32px);margin:0 0 10px}
  .card p{color:var(--sub);margin:6px 0;font-size:clamp(13px,2vw,16px);line-height:1.7}
  .keyhint{display:inline-block;background:rgba(255,255,255,.12);border:1px solid var(--line);
    border-radius:8px;padding:2px 9px;margin:2px;font-weight:700;font-family:ui-monospace,monospace}
  .levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}
  .lvcard{background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:12px;
    padding:8px 10px;cursor:pointer;text-align:left;transition:.15s;font-family:inherit;color:var(--text)}
  .lvcard:hover:not(.locked){background:rgba(255,255,255,.15);transform:translateY(-2px)}
  .lvcard.locked{opacity:.38;cursor:not-allowed}
  .lvcard .n{font-size:11px;color:var(--accent);font-weight:700}
  .lvcard .t{font-size:15px;font-weight:700;margin:2px 0}
  .lvcard .d{font-size:11px;color:var(--sub);line-height:1.4}
  .lvcard .hs{font-size:11px;color:#7dd3fc;margin-top:4px}
  .stars{font-size:34px;letter-spacing:6px;margin:8px 0}
  .stage{margin:8px 0 2px}
  .lvcard.secret{background:linear-gradient(180deg,rgba(250,204,21,.14),rgba(168,85,247,.14));
    border-color:rgba(250,204,21,.45)}
  .lvcard.secret.locked{background:rgba(255,255,255,.05);border-color:var(--line)}
  .lvcard.secret .n{color:#facc15}
  .exstage .stage-h{color:#facc15;border-color:rgba(250,204,21,.5)}
  .stage-h{font-size:12px;font-weight:700;color:var(--accent);text-align:left;
    letter-spacing:1px;border-bottom:1px solid var(--line);padding-bottom:3px}
  .stage-n{font-size:11px;color:var(--sub);text-align:left;margin-top:-4px}
  .levels{margin:8px 0}

  /* ---------- keyboard ---------- */
  #kbWrap{width:100%;margin-top:10px;background:var(--panel);border:1px solid var(--line);
    border-radius:16px;padding:10px 8px 12px}
  #kb{display:flex;flex-direction:column;gap:5px;align-items:center}
  .krow{display:flex;gap:5px;justify-content:center}
  .key{
    width:clamp(26px,4.1vw,46px);height:clamp(26px,4.1vw,46px);
    border-radius:8px;display:flex;align-items:center;justify-content:center;
    font-size:clamp(11px,1.7vw,17px);font-weight:800;font-family:ui-monospace,monospace;
    background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.10);
    color:rgba(255,255,255,.22);transition:transform .06s, box-shadow .1s;
  }
  .key.on{color:#0b1026;border-color:rgba(255,255,255,.35)}
  .key.target{animation:kpulse .7s ease-in-out infinite}
  .key.press{transform:translateY(3px) scale(.94);box-shadow:0 0 0 3px rgba(255,255,255,.5) inset}
  .key.miss{background:#ef4444 !important;color:#fff !important;
    box-shadow:0 0 0 4px rgba(239,68,68,.65);animation:kshake .18s}
  @keyframes kshake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
  @keyframes kpulse{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.0)}50%{box-shadow:0 0 0 4px rgba(255,255,255,.55)}}
  .key.wide{width:clamp(52px,9vw,100px)}
  .khome{position:relative}
  .khome::after{content:"";position:absolute;bottom:4px;left:50%;transform:translateX(-50%);
    width:40%;height:2px;background:rgba(0,0,0,.55);border-radius:2px}
  #fingerLegend{display:flex;flex-wrap:wrap;gap:6px 10px;justify-content:center;margin-top:9px;
    font-size:11px;color:var(--sub)}
  #fingerLegend span{display:flex;align-items:center;gap:4px}
  #fingerLegend i{width:11px;height:11px;border-radius:3px;display:inline-block}
  #note{font-size:12px;color:var(--sub);text-align:center;margin-top:10px;line-height:1.6}
  @media(max-width:620px){ .hud-item b{font-size:17px} }
</style>
</head>
<body>
<div id="app">

  <div id="hud">
    <div class="hud-item" id="hudTime">のこり <b id="vTime">60</b><span class="unit">びょう</span>
      <span id="vDrain"></span></div>
    <div class="hud-item" id="hudLevel">レベル <b id="vLevel">1</b></div>
    <div class="hud-item">スコア <b id="vScore">0</b></div>
    <div class="hud-item" id="hudCombo">コンボ <b id="vCombo">0</b></div>
    <div class="hud-item">せいかくさ <b id="vAcc">100%</b></div>
    <div class="hud-item" id="hudMiss">ミス <b id="vMiss">0</b></div>
    <div class="hud-item" id="hudLives">❤️❤️❤️❤️❤️</div>
    <div class="spacer"></div>
    <button class="btn ghost" id="btnSound">🔊 おと ON</button>
    <button class="btn ghost" id="btnMenu">メニュー</button>
  </div>

  <div id="timeWrap"><div id="timeBar"></div></div>
  <div id="goalWrap"><div id="goalBar"></div><div id="goalTxt"></div></div>

  <div id="stageWrap">
    <canvas id="cv" width="960" height="560"></canvas>
    <div id="overlay"><div class="card" id="card"></div></div>
  </div>

  <div id="kbWrap">
    <div id="kb"></div>
    <div id="fingerLegend"></div>
  </div>

  <div id="note">
    ※ にゅうりょくは <b>半角英数（はんかくえいすう）</b> モードにしてね。<br>
    キーボードの <b>F</b> と <b>J</b> のでっぱりに、ひとさしゆびを おいて スタート！<br>
    <b style="color:#f87171">まちがった キーを おすと てんすうが へります。あわてず、1つずつ ていねいに！</b><br>
    せいこう するたびに もちじかんが すこし ふえます。じかんが 0 になるまで ハイスコアを ねらおう！
  </div>
</div>

/* ---------------- セーブ（localStorage、使えない環境ではメモリ） ---------------- */
const Save = (()=>{
  const KEY='typingAdventureSave_v2';
  let mem={hi:{}, cleared:{}};
  let usable=true;
  try{
    const t='__t'; localStorage.setItem(t,'1'); localStorage.removeItem(t);
    const raw=localStorage.getItem(KEY);
    if(raw) mem=Object.assign(mem, JSON.parse(raw));
  }catch(e){ usable=false; }
  if(!mem.hi) mem.hi={};
  if(!mem.cleared) mem.cleared={};
  function flush(){ if(!usable) return; try{ localStorage.setItem(KEY, JSON.stringify(mem)); }catch(e){} }
  const api = {
    data:mem,
    hi(id){ return mem.hi[id]||0; },
    setHi(id,v){ if(v>(mem.hi[id]||0)){ mem.hi[id]=v; flush(); return true;} return false; },
    setStars(id,s){ if(s>(mem.cleared[id]||0)){ mem.cleared[id]=s; flush(); } },
    stars(id){ return mem.cleared[id]||0; },
    isCleared(id){ return (mem.cleared[id]||0)>0; },
    /* そのレベルが あそべるか（ひつような レベルを ぜんぶ クリアしていれば OK） */
    bossRecord(){ return mem.bossRec||0; },
    setBossRecord(n){ if(n>(mem.bossRec||0)){ mem.bossRec=n; flush(); return true; } return false; },
    isOpen(L){
      if(!L.req.every(k=>api.isCleared(k))) return false;
      if(L.reqBossKills && api.bossRecord()<L.reqBossKills) return false;
      return true;
    },
    /* まだ クリアしていない、あそべる レベルの さいしょの もの */
    firstTodo(){
      for(const L of LEVELS){ if(api.isOpen(L) && !api.isCleared(L.id)) return L; }
      for(let i=LEVELS.length-1;i>=0;i--){ if(api.isOpen(LEVELS[i])) return LEVELS[i]; }
      return LEVELS[0];
    },
    /* クリアごの「つぎ」：まだクリアしてない あそべるレベル */
    nextAfter(id){
      const todo=LEVELS.filter(L=>api.isOpen(L) && !api.isCleared(L.id));
      if(!todo.length) return null;
      const cur=LV[id];
      return todo.find(L=>L.index>cur.index) || todo[0];
    },
    reset(){ mem.hi={}; mem.cleared={}; mem.bossRec=0; flush(); }
  };
  return api;
})();

/* ---------------- サウンド（Web Audio、ファイル不要） ---------------- */
const Sound = (()=>{
  let ctx=null, master=null, on=true, bgmOn=false, bgmTimer=null, step=0, nextTime=0;
  function init(){
    if(ctx) return;
    try{
      ctx = new (window.AudioContext||window.webkitAudioContext)();
      master = ctx.createGain(); master.gain.value=0.32; master.connect(ctx.destination);
    }catch(e){ ctx=null; }
  }
  function resume(){ init(); if(ctx && ctx.state==='suspended') ctx.resume(); }
  function beep(freq, dur, type, vol, slide){
    if(!on||!ctx) return;
    const t=ctx.currentTime;
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type=type||'square'; o.frequency.setValueAtTime(freq,t);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40,slide), t+dur);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol||0.25, t+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+0.02);
  }
  function noise(dur, vol){
    if(!on||!ctx) return;
    const n=Math.floor(ctx.sampleRate*dur);
    const buf=ctx.createBuffer(1,n,ctx.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
    const s=ctx.createBufferSource(); s.buffer=buf;
    const g=ctx.createGain(); g.gain.value=vol||0.2;
    const f=ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=1600;
    s.connect(f); f.connect(g); g.connect(master); s.start();
  }
  const SCALE=[523.25,587.33,659.25,698.46,783.99,880.0,987.77,1046.5];
  const BGM=[0,2,4,2,5,4,2,0, 4,5,7,5,4,2,0,2];
  function bgmTick(){
    if(!ctx||!on||!bgmOn) return;
    while(nextTime < ctx.currentTime + 0.25){
      const t=Math.max(nextTime, ctx.currentTime+0.02);
      const idx=BGM[step%BGM.length];
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.type='triangle'; o.frequency.setValueAtTime(SCALE[idx]/2, t);
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.075,t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.22);
      o.connect(g); g.connect(master); o.start(t); o.stop(t+0.25);
      if(step%4===0){
        const b=ctx.createOscillator(), bg=ctx.createGain();
        b.type='sine'; b.frequency.setValueAtTime(98,t);
        bg.gain.setValueAtTime(0.0001,t);
        bg.gain.exponentialRampToValueAtTime(0.16,t+0.02);
        bg.gain.exponentialRampToValueAtTime(0.0001,t+0.28);
        b.connect(bg); bg.connect(master); b.start(t); b.stop(t+0.3);
      }
      step++; nextTime = t + 0.24;
    }
  }
  return {
    resume, isOn(){return on;},
    toggle(){ on=!on; if(!on){ stopBgm(); } return on; },
    type(){ beep(880,0.05,'square',0.10); },
    hit(){ beep(1200,0.09,'square',0.22,1900); },
    pop(){ noise(0.12,0.28); beep(1500,0.08,'sine',0.18,600); },
    big(){ beep(300,0.3,'sawtooth',0.25,80); noise(0.3,0.3); },
    miss(){ beep(160,0.16,'sawtooth',0.16,90); },
    tick(){ beep(1400,0.07,'square',0.20); },
    life(){ beep(200,0.35,'square',0.22,70); },
    clear(){ [523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,0.22,'triangle',0.28),i*110)); },
    over(){ [440,392,330,262].forEach((f,i)=>setTimeout(()=>beep(f,0.3,'sawtooth',0.22),i*160)); },
    startBgm(){ resume(); if(!ctx||!on) return; bgmOn=true; step=0; nextTime=ctx.currentTime+0.1;
      if(bgmTimer) clearInterval(bgmTimer); bgmTimer=setInterval(bgmTick,60); },
    stopBgm
  };
  function stopBgm(){ bgmOn=false; if(bgmTimer){ clearInterval(bgmTimer); bgmTimer=null; } }
})();

}
function floatText(x,y,txt,color,size){

function burst(x,y,color,n,spd){

}

/* ---------------- 入力 ---------------- */
const CODE_MAP={Semicolon:';',Comma:',',Period:'.',Slash:'/',Minus:'-',Quote:"'"};
function codeToChar(e){
  const c=e.code||'';
  if(/^Key[A-Z]$/.test(c)) return c.slice(3).toLowerCase();
  if(/^Digit[0-9]$/.test(c)) return c.slice(5);
  if(CODE_MAP[c]) return CODE_MAP[c];
  const k=e.key||'';
  if(k.length===1 && /[a-z0-9;,.\/\-]/i.test(k)) return k.toLowerCase();
  return null;
}

window.addEventListener('keydown', e=>{
  if(e.key===' '||e.code==='Space'){ e.preventDefault(); }
  Sound.resume();
  if(G.scene!=='play'){
    if(e.code==='Space'||e.code==='Enter'||e.code==='NumpadEnter'){
      const b=card.querySelector('button[data-primary]');
      if(b) b.click();
    }
    return;
  }
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  const ch=codeToChar(e);
  if(!ch) return;                       // Shift や Space などは カウントしない
  e.preventDefault();
  pressAnim(ch);
  G.typed++;
  handleChar(ch);                       // レベル外のキーも「ミス」として あつかう
  updateHUD();
});

/* ミス：てんすうが へる。つづけて ミスすると もっと へる（-20 → -30 → -40 …さいだい -60） */
const MISS_BASE=20, MISS_STEP=10, MISS_MAX=60;
function registerMiss(ch){
  G.combo=0;
  G.missStreak++; G.misses++;
  const pen=Math.min(MISS_MAX, MISS_BASE+(G.missStreak-1)*MISS_STEP);
  G.score=Math.max(0, G.score-pen);
  Sound.miss();
  G.shake=Math.max(G.shake,9);
  G.flash=Math.max(G.flash,0.34);
  missAnim(ch);
  const fx = (G.lv.mode==='acorn'||G.lv.mode==='balloon') ? W/2 : G.cannonX;
  floatText(fx, H-150, 'ミス！ -'+pen, '#f87171', 32);
  if(G.missStreak>=3){
    floatText(fx, H-208, 'キーを よく みて！', '#fbbf24', 22);
  }
}
function handleChar(ch){
  // ボス優先：もじが あう ボスの うち、こうげきが いちばん ちかい ものを ねらう
  let bt=null;
  for(const b of G.bosses){
    if(b.dying || b.seq[b.pos]!==ch) continue;
    if(!bt || b.charge>bt.charge) bt=b;
  }
  if(bt){
    bt.pos++; G.combo++; G.hits++; G.missStreak=0; addTime(TIME_PER_HIT);
    if(G.combo>G.maxCombo) G.maxCombo=G.combo;
    Sound.hit(); shootAt(bt.x,bt.y+10,'#ff6b6b');
    burst(bt.x+rnd(-40,40),bt.y+rnd(-25,25),'#ffb4b4',10);
    const p=addScore(10); floatText(bt.x,bt.y-60,'+'+p,'#ffd54a',24);
    if(bt.pos>=bt.seq.length){
      bt.hp--; bt.pos=0; bt.seq=makeSeq(bt.len);
      bt.charge=Math.max(0, bt.charge-0.45);   // ダメージで こうげきを おくらせる
      G.shake=14; Sound.big(); burst(bt.x,bt.y,'#ff9f43',40,420);
      const bp=addScore(25); floatText(bt.x,bt.y-90,'HIT! +'+bp,'#ff9f43',30);
      if(bt.hp<=0){
        bt.dying=1.0; Sound.big(); G.shake=26;
        G.bossKills++;
        const kp=addScore(bt.final?BOSS_BONUS*3:BOSS_BONUS); addTime(TIME_BOSS);
        floatText(bt.x,bt.y-46,(bt.final?'うらボス':'ボス')+' げきは！ +'+kp,'#4ade80',bt.final?42:30);
        floatText(bt.x,bt.y+2,'じかん +'+TIME_BOSS+'びょう','#7dd3fc',26);
        layoutBosses();
      }
    }
    if(G.combo>0 && G.combo%10===0){
      addTime(TIME_COMBO);
      floatText(W/2,140,G.combo+' れんぞく せいこう！ x'+multiplier(),'#7dd3fc',34);
      floatText(W/2,184,'じかん +'+TIME_COMBO+'びょう','#4ade80',28);
      Sound.clear();
    }
    return;
  }

  // 通常オブジェクト：一番下（危険）にあるものを狙う
  let target=null;
  for(const o of G.objs){
    if(o.dead||o.ch!==ch) continue;
    if(!target || o.y>target.y) target=o;
  }
  if(!target){
    registerMiss(ch);
    return;
  }
  G.hits++; G.combo++; G.missStreak=0; addTime(TIME_PER_HIT);
  if(G.combo>G.maxCombo) G.maxCombo=G.combo;

  if(G.lv.mode==='balloon'){
    target.boost = 170;                   // 上へ ぐいっと
    target.ch = freeChar();               // もじを つけかえ
    Sound.pop();
    burst(target.x,target.y,target.col,10,180);
    const p=addScore(6);
    floatText(target.x,target.y+58,'+'+p,'#fff',22);
    /* ふうせんが ふえるのは「れんぞく せいこう」したとき だけ。
       1かいでも ミスすると コンボが 0に もどるので、また はじめから。 */
  } else if(G.lv.mode==='acorn'){
    target.dead=true; target.collect=1;
    Sound.hit();
    burst(target.x,target.y,'#d9a441',12);
    const p=addScore(10);
    floatText(target.x,target.y-30,'+'+p,'#ffd54a',24);
  } else {
    target.dead=true;
    shootAt(target.x,target.y,'#7dd3fc');
    Sound.hit();
    burst(target.x,target.y,'#7dd3fc',16,300);
    const p=addScore(10);
    floatText(target.x,target.y-30,'+'+p,'#ffd54a',24);
  }
  if(G.combo>0 && G.combo%10===0){
    addTime(TIME_COMBO);
    floatText(W/2,140,G.combo+' れんぞく せいこう！ x'+multiplier(),'#7dd3fc',34);
    floatText(W/2,184,'じかん +'+TIME_COMBO+'びょう','#4ade80',28);
    Sound.clear();
    if(G.lv.mode==='balloon' && aliveBalloons()<G.lv.maxObj){
      spawnBalloon();
      floatText(W/2,228,'ふうせんが ふえた！','#4ade80',30);
    }
  }
}
function aliveBalloons(){ return G.objs.filter(o=>o.type==='balloon'&&!o.dead).length; }
function shootAt(x,y,col){
  G.shots.push({x0:G.cannonX,y0:H-58,x1:x,y1:y,t:0,col:col||'#7dd3fc'});
  G.cannonTx=Math.max(50,Math.min(W-50,x));
}
function makeSeq(len){
  const s=[]; const n=len||3; for(let i=0;i<n;i++) s.push(pick(G.lv.keys)); return s;
}
/* うらボスステージ：ウェーブごとに ボスが 複数 同時に でてくる ＋ ざこも すごい はやさで ふってくる */
const EX_WAVES = [
  { name:'だい1じん　ボス 3たい どうじ',
    groups:[{n:3, hp:2, len:3, charge:20, col:'#be123c', scale:0.60, attack:'time', name:'したっぱボス'}],
    mon:{speed:100, spawn:1.45, max:3} },
  { name:'だい2じん　ボス 4たい どうじ',
    groups:[{n:4, hp:2, len:3, charge:18, col:'#7c3aed', scale:0.58, attack:'time', name:'かんぶボス'}],
    mon:{speed:115, spawn:1.25, max:4} },
  { name:'★ うらボス ★',
    groups:[{n:1, hp:6, len:4, charge:12, col:'#1e1b4b', scale:1.00, attack:'life', name:'★ うらボス ★', final:1},
            {n:2, hp:2, len:3, charge:22, col:'#0891b2', scale:0.55, attack:'time', name:'しんえいボス'}],
    mon:{speed:130, spawn:1.15, max:4} }
];
const SIDE_SLOTS=[0.10,0.90,0.24,0.76];
function layoutBosses(){
  const list=G.bosses.filter(b=>!b.dying);
  const fin=list.filter(b=>b.final), sub=list.filter(b=>!b.final);
  fin.forEach(b=>{ b.slotX=W/2; b.baseY=225; b.amp=95; });
  sub.forEach((b,i)=>{
    if(fin.length){ b.slotX = W*(SIDE_SLOTS[i%4]||0.5); b.baseY = 150; b.amp=34; }
    else { b.slotX = W*(i+1)/(sub.length+1); b.baseY = 150; b.amp=60; }
  });
}
function spawnWave(w){
  w.groups.forEach(g=>{
    for(let i=0;i<g.n;i++){
      G.bosses.push({x:W/2, y:120, slotX:W/2, baseY:140,
        hp:g.hp, maxhp:g.hp, seq:makeSeq(g.len), len:g.len, pos:0,
        sway:rnd(0,6.3), swaySp:rnd(0.9,1.5), dying:0, charge:0,
        chargeTime:g.charge, col:g.col, scale:g.scale, final:!!g.final,
        attack:g.attack||'life', name:g.name||'ボス'});
    }
  });
  layoutBosses();
  const hasFinal=w.groups.some(g=>g.final);
  floatText(W/2, hasFinal?430:330, w.name+' しゅつげん！', hasFinal?'#facc15':'#f87171', hasFinal?50:38);
  Sound.big(); G.shake=hasFinal?30:16;
  if(hasFinal) floatText(W/2,486,'うらボスを たおせば クリア！','#fff',30);
}
/* ---------------- じかん ---------------- */
const TIME_START   = 60;    // さいしょの もちじかん（びょう）
const TIME_CAP     = 99;    // いちどに もてる じかんの さいだい
const TIME_PER_HIT = 0.4;   // 1かい せいこう するたびに ふえる じかん
const TIME_COMBO   = 3;     // 10コンボごとの ボーナス
const TIME_BOSS    = 10;    // ボスを たおしたときの じかんボーナス
const BOSS_CHARGE  = 15;    // ボスが こうげきするまでの びょうすう
const BOSS_RESPAWN = 8;     // つぎの ボスが でるまで
const BOSS_TIME_HIT= 8;     // ざこボスの こうげきで へる じかん
const BOSS_BONUS   = 300;   // ボス げきはの てんすう
const TIME_BANK    = 90;    // 1つの レベルで ふやせる じかんの ごうけい
function addTime(sec){
  if(G.scene!=='play' || G.timeBank<=0) return;
  const give=Math.min(sec, G.timeBank);
  G.timeBank-=give;
  const before=G.timeLeft;
  G.timeLeft=Math.min(TIME_CAP, G.timeLeft+give);
  if(G.timeLeft>before) G.timeGlow=0.3;
  if(G.timeBank<=0 && !G.bankWarned){
    G.bankWarned=true;
    floatText(W/2, H/2-90, 'じかんは もう ふえない！', '#fbbf24', 34);
    floatText(W/2, H/2-48, 'ラストスパート！', '#f87171', 30);
    Sound.big();
  }
}
function clearOK(){
  if(G.lv.mode==='exboss') return false;      // うらボスを たおした ときだけ クリア（べつ しょり）
  if(G.score < G.lv.goal) return false;
  if(G.lv.needBoss && G.bossKills < G.lv.needBoss) return false;
  return true;
}
function missingWhat(){
  if(G.score < G.lv.goal) return 'score';
  if(G.lv.needBoss && G.bossKills < G.lv.needBoss) return 'boss';
  return null;
}
function timeUp(){
  G.timeLeft=0;
  if(clearOK()) levelClear('time');
  else gameOver('time');
}

/* ---------------- 更新 ---------------- */
function loseLife(reason,x,y){
  G.lives--; G.combo=0; G.shake=18; G.flash=0.5;
  Sound.life();
  if(x!==undefined) burst(x,y,'#f87171',20,300);
  if(G.lives<=0) endRun('life');
}
/* ライフぎれ でも スコアが クリアラインを こえていれば クリア */
function endRun(reason){
  if(clearOK()) levelClear(reason);
  else gameOver(reason);
}
function update(dt){
  G.time+=dt;
  G.shake=Math.max(0,G.shake-dt*40);
  G.flash=Math.max(0,G.flash-dt*1.6);
  G.beam=Math.max(0,G.beam-dt);
  G.cannonX += (G.cannonTx-G.cannonX)*Math.min(1,dt*9);

  // パーティクル/フロート/ショット
  for(let i=G.parts.length-1;i>=0;i--){
    const p=G.parts[i]; p.t+=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=520*dt;
    if(p.t>p.life) G.parts.splice(i,1);
  }
  for(let i=G.floats.length-1;i>=0;i--){
    const f=G.floats[i]; f.t+=dt; f.y-=42*dt; if(f.t>f.life) G.floats.splice(i,1);
  }
  for(let i=G.shots.length-1;i>=0;i--){
    G.shots[i].t+=dt*7; if(G.shots[i].t>1) G.shots.splice(i,1);
  }
  if(G.scene!=='play') return;

  /* --- じかん --- */
  G.timeGlow=Math.max(0,G.timeGlow-dt);
  G.timeLeft-=dt;
  const secs=Math.ceil(G.timeLeft);
  if(secs<=5 && secs>0 && secs!==G.lastTick){ G.lastTick=secs; Sound.tick(); }
  if(secs===10 && G.lastTick>10){ G.lastTick=10; floatText(W/2,H/2-40,'のこり 10びょう！','#fbbf24',40); }
  if(G.timeLeft<=0){ timeUp(); return; }

  const mode=G.lv.mode;

  /* --- スポーン --- */
  if(mode==='exboss'){
    const wv = EX_WAVES[Math.min(G.exWave, EX_WAVES.length-1)].mon;
    G.spawnT-=dt;
    const alive=G.objs.filter(o=>!o.dead).length;
    if(G.spawnT<=0 && alive<wv.max){
      G.spawnT = wv.spawn;
      G.objs.push({type:'mon',ch:freeChar(),x:rnd(60,W-60),y:-40,
        vy:wv.speed*rnd(.9,1.15), kind:Math.floor(rnd(0,3)),
        sway:rnd(0,6.28), hp:1, dead:false});
    }
  } else if(mode!=='balloon'){
    G.spawnT-=dt;
    const alive=G.objs.filter(o=>!o.dead).length;
    if(G.spawnT<=0 && alive<G.lv.maxObj){
      G.spawnT = G.lv.spawn / diff();
      if(mode==='acorn') spawnAcorn(); else spawnMonster();
    }
  }

  /* --- ボス --- */
  if(mode==='boss' || mode==='exboss'){
    const live = G.bosses.filter(b=>!b.dying).length;
    if(live===0){
      G.bossT-=dt;
      if(G.bossT<=0 && G.bosses.length===0){
        if(mode==='exboss'){
          if(G.exWave<EX_WAVES.length) spawnWave(EX_WAVES[G.exWave]);
        } else {
          G.bosses.push({x:W/2,y:120,slotX:W/2,baseY:120,hp:3,maxhp:3,seq:makeSeq(3),len:3,
            pos:0,sway:0,swaySp:1.4,dying:0,charge:0,chargeTime:BOSS_CHARGE,
            col:'#be123c',scale:1,final:false,attack:'life',name:'ボス'});
          floatText(W/2,300,'ボス しゅつげん！','#f87171',40); Sound.big();
        }
      }
    }
    for(let i=G.bosses.length-1;i>=0;i--){
      const b=G.bosses[i];
      if(b.dying>0){
        b.dying-=dt;
        burst(b.x+rnd(-60,60),b.y+rnd(-40,40),'#ff9f43',3,260);
        if(b.dying<=0){
          const wasFinal=b.final;
          G.bosses.splice(i,1);
          if(wasFinal){ levelClear('final'); return; }
          layoutBosses();
          if(G.bosses.length===0){
            if(mode==='exboss'){ G.exWave++; G.bossT=2.5; }
            else G.bossT=BOSS_RESPAWN;
          }
        }
        continue;
      }
      b.sway += dt*b.swaySp;
      b.x = (b.slotX||W/2) + Math.sin(b.sway)*(b.amp!==undefined? b.amp : (b.final?110:60));
      b.y = (b.baseY||120) + Math.sin(b.sway*1.7)*(b.final?26:16);
      b.charge += dt/(b.chargeTime||BOSS_CHARGE);
      if(b.charge>=1){
        b.charge=0; G.shake=24; Sound.big();
        if(b.attack==='time'){
          G.timeLeft=Math.max(0.1, G.timeLeft-BOSS_TIME_HIT);
          G.combo=0; G.flash=Math.max(G.flash,0.4);
          floatText(b.x,b.y+120,'こうげき！ じかん -'+BOSS_TIME_HIT+'びょう','#f87171',30);
        } else {
          G.beam=0.45;
          floatText(W/2,H/2,(b.final?'うらボスの':'ボスの')+' こうげき！','#f87171',44);
          loseLife('boss',G.cannonX,H-60);
          if(G.scene!=='play') return;
        }
      }
    }
  }

  /* --- オブジェクト --- */
  for(let i=G.objs.length-1;i>=0;i--){
    const o=G.objs[i];

    if(o.type==='balloon'){
      if(o.dead){
        o.deadT+=dt; o.y=Math.min(H-34,o.y+18*dt);
        if(o.deadT>2.2) G.objs.splice(i,1);
        continue;
      }
      o.sway+=dt*1.6;
      if(o.boost>0){
        const up=Math.min(o.boost, 520*dt);
        o.y-=up; o.boost-=up;
      } else {
        o.y+=o.vy*dt;
      }
      o.x += Math.sin(o.sway)*14*dt;
      o.x = Math.max(46, Math.min(W-46, o.x));
      if(o.y<BALLOON_CEIL){                // てんじょうに あたった → それより うえには いかない
        o.y=BALLOON_CEIL;
        if(o.boost>0){ o.boost=0; burst(o.x,BALLOON_CEIL-26,'#ffffff',6,120); }
      }
      if(o.y>H-46){                        // ゆかへ おちた → もう おせない
        o.dead=true; o.deadT=0; o.y=H-46;
        G.combo=0; Sound.miss();
        floatText(o.x,H-90,'しぼんだ…','#f87171',22);
        if(aliveBalloons()===0){ endRun('balloon'); return; }
      }
      continue;
    }

    if(o.type==='acorn'){
      if(o.dead){                          // リスへ とんでいく
        o.collect=(o.collect||1)-dt*2.2;
        const tx=W/2, ty=H-60;
        o.x += (tx-o.x)*Math.min(1,dt*7);
        o.y += (ty-o.y)*Math.min(1,dt*7);
        if(o.collect<=0) G.objs.splice(i,1);
        continue;
      }
      o.sway+=dt*2; o.y+=o.vy*dt; o.x+=Math.sin(o.sway)*10*dt;
      if(o.y>H-46){
        G.objs.splice(i,1);
        loseLife('miss',o.x,H-60);
        floatText(o.x,H-100,'おっこちた！','#f87171',24);
        if(G.scene!=='play') return;
      }
      continue;
    }

    // monster
    if(o.dead){ G.objs.splice(i,1); continue; }
    o.sway+=dt*2.4; o.y+=o.vy*dt; o.x+=Math.sin(o.sway)*22*dt;
    o.x=Math.max(36,Math.min(W-36,o.x));
    if(o.y>H-70){
      G.objs.splice(i,1);
      loseLife('reach',o.x,H-80);
      floatText(o.x,H-120,'とっぱされた！','#f87171',24);
      if(G.scene!=='play') return;
    }
  }

  /* クリアラインを こえても ゲームは つづく（じかん０まで ハイスコアを ねらう） */
  markTargets(usedChars());
}

/* ---------------- 描画 ---------------- */
function bg(){
  const g=ctx.createLinearGradient(0,0,0,H);
  if(G.lv && G.lv.mode==='acorn'){ g.addColorStop(0,'#123a5e'); g.addColorStop(1,'#1c5c3a'); }
  else if(G.lv && G.lv.mode==='balloon'){ g.addColorStop(0,'#1b4f8a'); g.addColorStop(1,'#7fb8e6'); }
  else if(G.lv && G.lv.mode==='boss'){ g.addColorStop(0,'#3b0d2e'); g.addColorStop(1,'#12061f'); }
  else if(G.lv && G.lv.mode==='exboss'){ g.addColorStop(0,'#1b0033'); g.addColorStop(1,'#000010'); }
  else { g.addColorStop(0,'#0b1030'); g.addColorStop(1,'#241340'); }
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

  // ほし / くさ
  if(!G.lv || G.lv.mode==='shoot' || G.lv.mode==='boss' || G.lv.mode==='exboss'){
    ctx.fillStyle='rgba(255,255,255,.55)';
    for(let i=0;i<70;i++){
      const x=(i*137.5)%W, y=(i*79.3)%(H-120);
      const tw=0.4+0.6*Math.abs(Math.sin(G.time*1.4+i));
      ctx.globalAlpha=tw*0.7; ctx.fillRect(x,y,2,2);
    }
    ctx.globalAlpha=1;
  }
  if(G.lv && G.lv.mode==='acorn'){
    ctx.fillStyle='rgba(0,0,0,.18)';
    for(let i=0;i<8;i++){ const x=i*130+40; ctx.fillRect(x,0,26,120); }
  }
  if(G.lv && G.lv.mode==='balloon'){
    // てんじょう（これより うえには いけない）
    const cy=BALLOON_CEIL-36;
    ctx.fillStyle='rgba(255,255,255,.20)'; ctx.fillRect(0,0,W,cy);
    for(let i=0;i<W;i+=26){
      ctx.fillStyle='rgba(255,255,255,.13)'; ctx.fillRect(i,0,13,cy);
    }
    ctx.fillStyle='rgba(255,255,255,.55)'; ctx.fillRect(0,cy-4,W,4);
    ctx.fillStyle='rgba(255,255,255,.85)';
    ctx.font='700 16px "Hiragino Maru Gothic ProN", sans-serif';
    ctx.textAlign='right'; ctx.textBaseline='middle';
    ctx.fillText('てんじょう', W-16, cy/2);
    ctx.fillStyle='rgba(255,255,255,.30)';
    for(let i=0;i<5;i++){
      const x=(i*230+G.time*12)%(W+240)-120, y=60+i*36;
      ctx.beginPath(); ctx.ellipse(x,y,70,26,0,0,6.3); ctx.fill();
      ctx.beginPath(); ctx.ellipse(x+40,y-14,44,22,0,0,6.3); ctx.fill();
    }
  }
  // じめん
  ctx.fillStyle='rgba(0,0,0,.35)'; ctx.fillRect(0,H-34,W,34);
  ctx.fillStyle='rgba(255,255,255,.12)'; ctx.fillRect(0,H-36,W,2);
}
function charLabel(x,y,ch,size){
  ctx.font='900 '+(size||26)+'px ui-monospace, "SF Mono", Consolas, monospace';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.lineWidth=6; ctx.strokeStyle='rgba(0,0,0,.75)';
  const t=ch===';'?';':ch.toUpperCase();
  ctx.strokeText(t,x,y); ctx.fillStyle='#fff'; ctx.fillText(t,x,y);
}
function drawAcorn(o){
  const s=o.dead?0.7:1;
  ctx.save(); ctx.translate(o.x,o.y); ctx.scale(s,s);
  ctx.fillStyle='#c8862f';
  ctx.beginPath(); ctx.ellipse(0,6,20,24,0,0,6.3); ctx.fill();
  ctx.fillStyle='#7a4a18';
  ctx.beginPath(); ctx.ellipse(0,-14,23,12,0,0,6.3); ctx.fill();
  ctx.fillRect(-2.5,-28,5,10);
  ctx.restore();
  if(!o.dead) charLabel(o.x,o.y+6,o.ch,24);
}
function drawBalloon(o){
  ctx.save();
  ctx.globalAlpha = o.dead?0.42:1;
  ctx.strokeStyle='rgba(255,255,255,.45)'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(o.x,o.y+30);
  ctx.quadraticCurveTo(o.x+8,o.y+50,o.x,o.y+68); ctx.stroke();
  ctx.fillStyle=o.col;
  ctx.beginPath();
  if(o.dead) ctx.ellipse(o.x,o.y+8,30,16,0,0,6.3);
  else ctx.ellipse(o.x,o.y,28,33,0,0,6.3);
  ctx.fill();
  if(!o.dead){
    ctx.fillStyle='rgba(255,255,255,.42)';
    ctx.beginPath(); ctx.ellipse(o.x-9,o.y-12,8,11,-0.4,0,6.3); ctx.fill();
    ctx.fillStyle=o.col;
    ctx.beginPath(); ctx.moveTo(o.x-6,o.y+31); ctx.lineTo(o.x+6,o.y+31); ctx.lineTo(o.x,o.y+40); ctx.fill();
  }
  ctx.restore();
  if(!o.dead) charLabel(o.x,o.y,o.ch,28);
}
function drawMonster(o){
  const cols=['#a78bfa','#4ade80','#fb923c'];
  const c=cols[o.kind%3], wob=Math.sin(G.time*7+o.sway)*3;
  ctx.save(); ctx.translate(o.x,o.y);
  ctx.fillStyle='rgba(0,0,0,.25)';
  ctx.beginPath(); ctx.ellipse(0,30,26,7,0,0,6.3); ctx.fill();
  ctx.fillStyle=c;
  ctx.beginPath();
  ctx.moveTo(-26,6+wob); ctx.quadraticCurveTo(-26,-30,0,-30);
  ctx.quadraticCurveTo(26,-30,26,6+wob);
  ctx.lineTo(26,18);
  for(let i=0;i<4;i++){ ctx.lineTo(26-i*13-6.5,28); ctx.lineTo(26-(i+1)*13,18); }
  ctx.closePath(); ctx.fill();
  // つの
  ctx.beginPath(); ctx.moveTo(-16,-26); ctx.lineTo(-22,-42); ctx.lineTo(-8,-30); ctx.fill();
  ctx.beginPath(); ctx.moveTo(16,-26); ctx.lineTo(22,-42); ctx.lineTo(8,-30); ctx.fill();
  // め
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.ellipse(-9,-8,7,8,0,0,6.3); ctx.fill();
  ctx.beginPath(); ctx.ellipse(9,-8,7,8,0,0,6.3); ctx.fill();
  ctx.fillStyle='#111';
  ctx.beginPath(); ctx.arc(-8,-6,3.4,0,6.3); ctx.fill();
  ctx.beginPath(); ctx.arc(10,-6,3.4,0,6.3); ctx.fill();
  ctx.restore();
  charLabel(o.x,o.y+13,o.ch,22);
}
const BOSS_IMG = new Image();
let bossImgOK=false;
BOSS_IMG.onload=()=>{ bossImgOK=true; };
BOSS_IMG.src = BOSS_IMG_SRC;

function drawBosses(){
  for(const b of G.bosses) drawOneBoss(b);
}
function drawOneBoss(b){
  const dy = b.dying>0? rnd(-8,8):0, sc=b.scale||1, col=b.col||'#be123c';
  const alpha = b.dying>0? Math.max(0,b.dying):1;

  if(b.final && bossImgOK){
    /* うらボスは 画像スプライト */
    const hgt = 330*sc, wdt = hgt*BOSS_IMG.width/BOSS_IMG.height;
    ctx.save();
    ctx.globalAlpha=alpha;
    const gl=ctx.createRadialGradient(b.x+dy,b.y+dy,20,b.x+dy,b.y+dy,hgt*0.72);
    gl.addColorStop(0,'rgba(168,85,247,.5)'); gl.addColorStop(1,'rgba(168,85,247,0)');
    ctx.fillStyle=gl; ctx.beginPath(); ctx.arc(b.x+dy,b.y+dy,hgt*0.72,0,6.3); ctx.fill();
    ctx.drawImage(BOSS_IMG, b.x+dy-wdt/2, b.y+dy-hgt/2, wdt, hgt);
    ctx.restore();
  } else {
    ctx.save(); ctx.translate(b.x+dy,b.y+dy); ctx.scale(sc,sc);
    ctx.globalAlpha=alpha;
    if(b.final){
      const gl=ctx.createRadialGradient(0,0,20,0,0,140);
      gl.addColorStop(0,'rgba(168,85,247,.55)'); gl.addColorStop(1,'rgba(168,85,247,0)');
      ctx.fillStyle=gl; ctx.beginPath(); ctx.arc(0,0,140,0,6.3); ctx.fill();
    }
    // かぶと風の あたま
    ctx.fillStyle='rgba(0,0,0,.5)';
    ctx.beginPath(); ctx.ellipse(0,4,84,62,0,0,6.3); ctx.fill();
    ctx.fillStyle=col;
    ctx.beginPath(); ctx.ellipse(0,-4,70,50,0,0,6.3); ctx.fill();
    // するどい つの
    ctx.fillStyle='#e8c66a';
    ctx.beginPath(); ctx.moveTo(-46,-34); ctx.lineTo(-84,-84); ctx.lineTo(-58,-72); ctx.lineTo(-24,-46); ctx.fill();
    ctx.beginPath(); ctx.moveTo(46,-34); ctx.lineTo(84,-84); ctx.lineTo(58,-72); ctx.lineTo(24,-46); ctx.fill();
    // おこった め（つりあがった さんかく）
    ctx.fillStyle='#fca5a5';
    ctx.beginPath(); ctx.moveTo(-52,-22); ctx.lineTo(-14,-6); ctx.lineTo(-18,10); ctx.lineTo(-50,-2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(52,-22); ctx.lineTo(14,-6); ctx.lineTo(18,10); ctx.lineTo(50,-2); ctx.fill();
    ctx.fillStyle='#7f1d1d';
    ctx.beginPath(); ctx.ellipse(-33,-6,9,7,-0.3,0,6.3); ctx.fill();
    ctx.beginPath(); ctx.ellipse(33,-6,9,7,0.3,0,6.3); ctx.fill();
    // きばの くち
    ctx.fillStyle='#180209';
    ctx.beginPath(); ctx.moveTo(-34,24); ctx.lineTo(34,24); ctx.lineTo(24,48); ctx.lineTo(-24,48); ctx.fill();
    ctx.fillStyle='#fff';
    for(let i=-3;i<=3;i++){
      const x=i*9;
      ctx.beginPath(); ctx.moveTo(x-4,24); ctx.lineTo(x+4,24); ctx.lineTo(x,36); ctx.fill();
      ctx.beginPath(); ctx.moveTo(x-4,48); ctx.lineTo(x+4,48); ctx.lineTo(x,38); ctx.fill();
    }
    ctx.restore();
  }
  if(b.dying>0) return;

  /* HP と こうげきチャージ */
  const bw = b.final? 300 : 118;
  const uy = b.y - (b.final? 178 : 56*sc+40);
  ctx.font='700 '+(b.final?15:11)+'px "Hiragino Maru Gothic ProN", sans-serif';
  ctx.fillStyle= b.final?'#facc15':'#fff'; ctx.textAlign='center'; ctx.textBaseline='alphabetic';
  ctx.fillText(b.name+'　HP '+b.hp+'/'+b.maxhp, b.x, uy-5);
  ctx.fillStyle='rgba(0,0,0,.65)'; ctx.fillRect(b.x-bw/2,uy,bw,b.final?12:8);
  ctx.fillStyle='#f87171'; ctx.fillRect(b.x-bw/2+2,uy+2,(bw-4)*(b.hp/b.maxhp),b.final?8:4);
  const near=b.charge>0.72, ch=b.final?9:6;
  ctx.fillStyle='rgba(0,0,0,.65)'; ctx.fillRect(b.x-bw/2,uy+(b.final?16:11),bw,ch);
  ctx.fillStyle= near? '#fbbf24':'#a78bfa';
  ctx.fillRect(b.x-bw/2+2,uy+(b.final?18:12),(bw-4)*b.charge,ch-4);
  if(near){
    ctx.font='700 12px "Hiragino Maru Gothic ProN", sans-serif';
    ctx.fillStyle='#fbbf24';
    ctx.fillText('こうげき くる！', b.x, uy+(b.final?44:30));
  }

  /* うつべき もじ */
  const big=b.final, gap=big?54:34, tw=big?22:15, fs=big?24:16;
  const n=b.seq.length, sx=b.x-(n-1)*gap/2;
  const ty=b.y + (big? 200 : 52*sc+26);
  ctx.fillStyle='rgba(6,10,30,.80)';
  roundRect(sx-tw-10, ty-tw-6, (n-1)*gap+(tw+10)*2, (tw+6)*2, big?14:9); ctx.fill();
  for(let i=0;i<n;i++){
    const x=sx+i*gap, done=i<b.pos;
    ctx.fillStyle = done? 'rgba(74,222,128,.92)' : (i===b.pos? 'rgba(255,213,74,.96)':'rgba(255,255,255,.20)');
    ctx.strokeStyle='rgba(0,0,0,.5)'; ctx.lineWidth=2;
    roundRect(x-tw,ty-tw,tw*2,tw*2,big?10:6); ctx.fill(); ctx.stroke();
    ctx.font='900 '+fs+'px ui-monospace, monospace'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillStyle = (done||i===b.pos)? '#0b1026':'#fff';
    ctx.fillText(b.seq[i]===';' ? ';' : b.seq[i].toUpperCase(), x, ty+1);
  }
}
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
function drawSquirrel(){
  const x=W/2,y=H-52;
  ctx.save(); ctx.translate(x,y);
  ctx.fillStyle='#b45309';
  ctx.beginPath(); ctx.ellipse(24,-8,14,26,0.5,0,6.3); ctx.fill();  // しっぽ
  ctx.fillStyle='#d97706';
  ctx.beginPath(); ctx.ellipse(0,4,20,22,0,0,6.3); ctx.fill();
  ctx.beginPath(); ctx.arc(-4,-20,15,0,6.3); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-14,-32); ctx.lineTo(-10,-44); ctx.lineTo(-3,-32); ctx.fill();
  ctx.beginPath(); ctx.moveTo(4,-33); ctx.lineTo(9,-44); ctx.lineTo(14,-31); ctx.fill();
  ctx.fillStyle='#111';
  ctx.beginPath(); ctx.arc(-9,-22,2.6,0,6.3); ctx.fill();
  ctx.beginPath(); ctx.arc(0,-22,2.6,0,6.3); ctx.fill();
  ctx.fillStyle='#7c2d12';
  ctx.beginPath(); ctx.arc(-4.5,-16,2.6,0,6.3); ctx.fill();
  ctx.restore();
}
function drawCannon(){
  const x=G.cannonX, y=H-44;
  ctx.save(); ctx.translate(x,y);
  ctx.fillStyle='#334155';
  roundRect(-34,-10,68,26,8); ctx.fill();
  ctx.fillStyle='#64748b';
  roundRect(-10,-34,20,28,6); ctx.fill();
  ctx.fillStyle='#38bdf8';
  ctx.beginPath(); ctx.arc(0,-36,6,0,6.3); ctx.fill();
  ctx.fillStyle='#1e293b';
  ctx.beginPath(); ctx.arc(-24,16,7,0,6.3); ctx.fill();
  ctx.beginPath(); ctx.arc(24,16,7,0,6.3); ctx.fill();
  ctx.restore();
}
function draw(){
  ctx.save();
  if(G.shake>0){ ctx.translate(rnd(-G.shake,G.shake)*.5, rnd(-G.shake,G.shake)*.5); }
  bg();

  if(G.lv){
    if(G.lv.mode==='acorn') drawSquirrel();
    if(G.lv.mode==='shoot'||G.lv.mode==='boss'||G.lv.mode==='exboss') drawCannon();
    for(const o of G.objs){
      if(o.type==='acorn') drawAcorn(o);
      else if(o.type==='balloon') drawBalloon(o);
      else drawMonster(o);
    }
    if(G.lv.mode==='boss'||G.lv.mode==='exboss') drawBosses();
  }
  // ボスの こうげきビーム
  if(G.beam>0){
    const t=G.beam/0.45;
    ctx.save(); ctx.globalAlpha=t;
    ctx.strokeStyle='#f87171'; ctx.lineWidth=10+30*(1-t);
    ctx.beginPath(); ctx.moveTo(W/2,140); ctx.lineTo(G.cannonX,H-44); ctx.stroke();
    ctx.strokeStyle='#fff'; ctx.lineWidth=4;
    ctx.beginPath(); ctx.moveTo(W/2,140); ctx.lineTo(G.cannonX,H-44); ctx.stroke();
    ctx.restore();
  }
  // レーザー
  for(const s of G.shots){
    const t=Math.min(1,s.t);
    ctx.strokeStyle=s.col; ctx.lineWidth=6*(1-t)+1;
    ctx.globalAlpha=1-t*0.8;
    ctx.beginPath(); ctx.moveTo(s.x0,s.y0); ctx.lineTo(s.x1,s.y1); ctx.stroke();
    ctx.globalAlpha=1;
  }
  // パーティクル
  for(const p of G.parts){
    ctx.globalAlpha=Math.max(0,1-p.t/p.life);
    ctx.fillStyle=p.c;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.3); ctx.fill();
  }
  ctx.globalAlpha=1;
  // フロートテキスト
  for(const f of G.floats){
    ctx.globalAlpha=Math.max(0,1-f.t/f.life);
    ctx.font='900 '+f.size+'px "Hiragino Maru Gothic ProN", sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.lineWidth=5; ctx.strokeStyle='rgba(0,0,0,.7)';
    ctx.strokeText(f.txt,f.x,f.y); ctx.fillStyle=f.color; ctx.fillText(f.txt,f.x,f.y);
  }
  ctx.globalAlpha=1;
  ctx.restore();

  if(G.flash>0){ ctx.fillStyle='rgba(248,113,113,'+(G.flash*0.5)+')'; ctx.fillRect(0,0,W,H); }

  // のこり5びょう：おおきな カウントダウン
  if(G.scene==='play' && G.timeLeft<=5 && G.timeLeft>0){
    const n=Math.ceil(G.timeLeft), f=1-(n-G.timeLeft);
    ctx.save();
    ctx.globalAlpha=0.30+0.35*f;
    ctx.font='900 '+(150+f*60)+'px "Hiragino Maru Gothic ProN", sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.lineWidth=10; ctx.strokeStyle='rgba(0,0,0,.5)';
    ctx.strokeText(n,W/2,H/2); ctx.fillStyle='#f87171'; ctx.fillText(n,W/2,H/2);
    ctx.restore();
  }
  // 風船モード：のこり数
  if(G.scene==='play'&&G.lv&&G.lv.mode==='balloon'){
    ctx.font='700 18px sans-serif'; ctx.textAlign='left'; ctx.textBaseline='top';
    ctx.fillStyle='rgba(0,0,0,.45)'; roundRect(12,50,190,32,8); ctx.fill();
    ctx.fillStyle='#fff'; ctx.fillText('ふうせん のこり '+aliveBalloons()+'こ', 24, 58);
  }
}

/* ---------------- HUD ---------------- */
function updateHUD(){
  el.level.textContent = G.lv? G.lv.id : '-';
  el.score.textContent = G.score;
  el.combo.textContent = G.combo;
  const acc = G.typed? Math.round(G.hits/G.typed*100):100;
  el.acc.textContent = acc+'%';
  el.acc.style.color = acc>=90?'#4ade80':(acc>=70?'#eef2ff':'#f87171');
  el.miss.textContent = G.misses;
  el.miss.style.color = G.misses>0?'#f87171':'#eef2ff';
  el.lives.textContent = G.lv && G.lv.mode==='balloon'
      ? '🎈'.repeat(Math.max(0,aliveBalloons()))
      : '❤️'.repeat(Math.max(0,G.lives));
  const pct = G.lv? Math.min(100, G.score/G.lv.goal*100):0;
  el.bar.style.width=pct+'%';
  const scoreOK = G.lv && G.score>=G.lv.goal && G.lv.mode!=='exboss';
  const bossOK  = !G.lv || !G.lv.needBoss || G.bossKills>=G.lv.needBoss;
  el.goalWrap.classList.toggle('done', !!(scoreOK&&bossOK));
  el.goalTxt.textContent = !G.lv ? ''
    : G.lv.mode==='exboss'
      ? ('だい'+Math.min(G.exWave+1,EX_WAVES.length)+'じん / '+EX_WAVES.length+
         '　のこりボス '+G.bosses.filter(b=>!b.dying).length+'たい'+
         '　うらボスを たおせば クリア！　スコア '+G.score)
    : !scoreOK ? (G.score+' / '+G.lv.goal+' てん が クリアライン'
                  + (G.lv.needBoss? '　＋ ボスを '+G.lv.needBoss+'たい たおす（いま '+G.bossKills+'たい）':''))
    : !bossOK  ? ('てんすうは OK！ あとは ボスを たおせば クリア！（いま '+G.bossKills+'たい）')
               : ('クリアライン とっぱ！ いまのスコア '+G.score+'　このまま ハイスコアを ねらえ！');

  // じかん
  const t = Math.max(0, G.timeLeft);
  el.time.textContent = Math.ceil(t);
  el.timeBar.style.width = Math.min(100, t/(G.timeStartLv||TIME_START)*100)+'%';
  const warn = t<=10;
  el.hudTime.classList.toggle('warn', warn && G.scene==='play');
  el.hudTime.classList.toggle('gain', G.timeGlow>0 && !warn);
  el.timeBar.classList.toggle('warn', warn);
  el.drain.textContent = (G.lv&&G.scene==='play'&&G.timeBank<=0) ? '⏳ じかんは もう ふえない！' : '';
}

/* ★の きじゅん：クリアラインを こえたら ★1、そこから ハイスコアを ねらう */
const STAR2=4, STAR3=10;
function starTargets(L){ return [L.goal, L.goal*STAR2, L.goal*STAR3]; }
function starsFor(L,score,acc){
  if(L.mode==='exboss'){ let st=1; if(acc>=85)st=2; if(acc>=95)st=3; return st; }
  let st=0;
  if(score>=L.goal) st=1;
  if(score>=L.goal*STAR2 && acc>=85) st=2;
  if(score>=L.goal*STAR3 && acc>=95) st=3;
  return st;
}
function recordBoss(){
  if(G.lv.mode!=='boss') return false;
  return Save.setBossRecord(G.bossKills) && Save.bossRecord()>=LV['EX'].reqBossKills;
}
function levelClear(reason){
  G.scene='clear'; Sound.stopBgm(); Sound.clear();
  const L=G.lv, idx=LEVELS.indexOf(L);
  const acc=G.typed?Math.round(G.hits/G.typed*100):100;
  const stars=starsFor(L,G.score,acc);
  const prevHi=Save.hi(L.id);
  const newHi=Save.setHi(L.id,G.score);
  const exWasOpen = Save.isOpen(LV['EX']);
  const exNowOpen0 = recordBoss();
  Save.setStars(L.id,stars);
  const exOpened = !exWasOpen && Save.isOpen(LV['EX']);
  const nxt = Save.nextAfter(L.id);
  const opened = LEVELS.filter(X=>X.req.indexOf(L.id)>=0 && Save.isOpen(X));
  const last = !nxt;
  show(
    (reason==='final'
      ? '<h1 style="color:#facc15">👑 うらボス げきは！！ 👑</h1>'+
        '<h2 style="color:#fff">かんぜん せいは おめでとう！ 🏆</h2>'
      : '<h1>🎉 レベル '+L.id+' クリア！</h1>')+
    (reason==='life'   ? '<p style="color:#fbbf24">❤️が なくなっちゃったけど、クリアラインは とっぱ！ ごうかく！</p>':'')+
    (reason==='balloon'? '<p style="color:#fbbf24">ふうせんは ぜんぶ おちたけど、クリアラインは とっぱ！ ごうかく！</p>':'')+
    '<div class="stars">'+'⭐'.repeat(stars)+'<span style="opacity:.25">'+'⭐'.repeat(3-stars)+'</span></div>'+
    '<h2 style="color:#fff;margin:4px 0">スコア '+G.score+' てん</h2>'+
    (newHi? '<p style="color:#4ade80;font-weight:700">🏆 さいこうきろく こうしん！（まえは '+prevHi+' てん）</p>'
          : '<p>さいこうきろく '+prevHi+' てん</p>')+
    '<p>せいかくさ <b style="color:#fff">'+acc+'%</b> ／ さいだいコンボ <b style="color:#fff">'+G.maxCombo+'</b> ／ '+
    'ミス <b style="color:'+(G.misses<=3?'#4ade80':'#f87171')+'">'+G.misses+'かい</b>'+
    (G.misses===0?'　パーフェクト！ 🏅':'')+
    (L.mode==='boss'? '<br>たおした ボス <b style="color:#4ade80">'+G.bossKills+'たい</b>':'')+'</p>'+
    (exOpened? '<p style="color:#facc15;font-weight:700;font-size:17px">'+
       '🔓 かくしステージ『うらボス』が あらわれた！<br>'+
       '<span style="font-size:13px">ボスしか でてこない ボスラッシュ。タイトルから えらべるよ</span></p>':'')+
    (L.mode==='exboss'? '' : stars<3? '<p style="color:#fbbf24">'+
        (stars<2 ? '⭐⭐ には '+(L.goal*STAR2)+'てん ＋ せいかくさ 85%<br>' : '')+
        '⭐⭐⭐ には '+(L.goal*STAR3)+'てん ＋ せいかくさ 95%<br>'+
        'もういちど あそんで ハイスコアを のばそう！</p>':
        '<p style="color:#4ade80">⭐⭐⭐ かんぺき！ さすが！</p>')+
    (last
      ? '<h2 style="margin-top:14px">ぜんレベル せいは！ すごい！！ 🏆</h2><button class="btn big" data-primary data-title>タイトルへ</button>'
      : ((opened.length && !exOpened)? '<p style="color:#4ade80;font-weight:700">🔓 レベル '+
             opened.map(X=>X.id).join(' と ')+' が あそべるように なった！</p>':'')+
        '<button class="btn big" data-primary data-next="'+nxt.index+'">'+
          (nxt.secret? '👑 うらボスに ちょうせん！':'レベル '+nxt.id+' へ →')+'</button>'+
        '<p style="margin-top:10px"><button class="btn ghost" data-retry="'+idx+'">もういちど</button> '+
        '<button class="btn ghost" data-title>タイトルへ</button></p>')
  );
  updateHUD();
}
function gameOver(reason){
  G.scene='over'; Sound.stopBgm(); Sound.over();
  const L=G.lv, idx=LEVELS.indexOf(L);
  const acc=G.typed?Math.round(G.hits/G.typed*100):100;
  const prevHi=Save.hi(L.id);
  const newHi=Save.setHi(L.id,G.score);
  const exWasOpen = Save.isOpen(LV['EX']);
  recordBoss();
  const exOpened = !exWasOpen && Save.isOpen(LV['EX']);
  const timeUpNear = reason==='time' && G.score>=L.goal*0.75;
  show(
    (reason==='time'
      ? '<h1 style="color:#f87171">⏰ じかん ぎれ！</h1>'
      : '<h1 style="color:#f87171">ゲームオーバー</h1>')+
    '<p>レベル '+L.id+'「'+L.title+'」'+
      (reason==='time'? '' : (L.mode==='balloon'? '　ふうせんが ぜんぶ おちた…':'　❤️が なくなった…'))+'</p>'+
    '<h2 style="color:#fff;margin:4px 0">スコア '+G.score+' / '+L.goal+' てん</h2>'+
    (L.needBoss? '<p>たおした ボス <b style="color:'+(G.bossKills?'#4ade80':'#f87171')+'">'+G.bossKills+'たい</b> / '+L.needBoss+'たい</p>':'')+
    (L.mode==='exboss'? '<p>たおした ボス <b style="color:#fff">'+G.bossKills+'たい</b>　'+
        'だい'+Math.min(G.exWave+1,EX_WAVES.length)+'じん まで すすんだ'+
        (G.exWave>=EX_WAVES.length-1? '<br><span style="color:#fbbf24">うらボスまで たどりついた！ あと ひといき！</span>':'')+'</p>':'')+
    (exOpened? '<p style="color:#facc15;font-weight:700;font-size:17px">'+
       '🔓 かくしステージ『うらボス』が あらわれた！<br>'+
       '<span style="font-size:13px">タイトルから えらべるよ</span></p>':'')+
    (missingWhat()==='boss'
      ? '<p style="color:#fbbf24">てんすうは たりていた！ でも ボスを たおせなかった…<br>'+
        'ボスが でてきたら、まず ボスの 3もじを ねらおう！</p>'
      : (timeUpNear? '<p style="color:#fbbf24">おしい！ あと '+(L.goal-G.score)+' てん で クリアだった！</p>':''))+
    (newHi&&G.score>0? '<p style="color:#4ade80">さいこうきろく こうしん！（まえは '+prevHi+' てん）</p>'
                     : '<p>さいこうきろく '+prevHi+' てん</p>')+
    '<p>せいかくさ '+acc+'% ／ さいだいコンボ '+G.maxCombo+' ／ ミス '+G.misses+'かい</p>'+
    (G.misses>=8 ? '<p style="color:#fbbf24">ヒント：あわてなくて だいじょうぶ。<br>もじを よく みてから、ゆっくり 1つずつ おそう！</p>' : '')+
    '<button class="btn big" data-primary data-retry="'+idx+'">もういちど チャレンジ</button>'+
    '<p style="margin-top:10px"><button class="btn ghost" data-title>タイトルへ</button></p>'
  );
  updateHUD();
}

/* ---------------- クリック処理 ---------------- */
card.addEventListener('click', e=>{
  const t=e.target.closest('button'); if(!t) return;
  Sound.resume();
  if(t.dataset.lv!==undefined && !t.disabled) return introScreen(+t.dataset.lv);
  if(t.dataset.start!==undefined) return introScreen(+t.dataset.start);
  if(t.dataset.go!==undefined) return startLevel(+t.dataset.go);
  if(t.dataset.next!==undefined) return introScreen(+t.dataset.next);
  if(t.dataset.retry!==undefined) return introScreen(+t.dataset.retry);
  if(t.dataset.title!==undefined) return titleScreen();
  if(t.dataset.reset!==undefined){
    Save.reset(); titleScreen();
  }
});
el.btnMenu.addEventListener('click',()=>{ Sound.resume(); titleScreen(); });
el.btnSound.addEventListener('click',()=>{
  Sound.resume();
  const on=Sound.toggle();
  el.btnSound.textContent = on? '🔊 おと ON':'🔇 おと OFF';
  if(on && G.scene==='play') Sound.startBgm();
});

/* ---------------- メインループ ---------------- */
let last=performance.now();
function loop(now){
  let dt=(now-last)/1000; last=now;
  if(dt>0.05) dt=0.05;
  update(dt);
  draw();
  if(G.scene==='play') updateHUD();
  requestAnimationFrame(loop);
}

buildKeyboard();
titleScreen();
requestAnimationFrame(loop);
</script>
</body>
</html>
